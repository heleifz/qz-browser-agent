<!doctype html>
<meta charset="utf-8">
<title>AX option disabled</title>
<style>
  body { margin: 12px; font: 16px sans-serif; }
  button, select, input { display: block; margin: 8px 0; min-width: 140px; min-height: 28px; }
</style>
<select id="city" aria-label="城市" disabled>
  <option value="">请选择</option>
</select>
<button id="load" type="button">加载城市</button>
<select id="province" aria-label="省份" disabled>
  <option value="zj">浙江</option>
  <option value="js">江苏</option>
</select>
<select id="route" aria-label="航线">
  <option value="g">庚</option>
  <option value="x">辛</option>
</select>
<select id="locked" aria-label="锁定" disabled>
  <option value="c">丙</option>
  <option value="d" disabled>丁</option>
</select>
<select id="grouped" aria-label="分组">
  <optgroup label="组" disabled>
    <option value="a">甲</option>
  </optgroup>
  <option value="b">乙</option>
</select>
<select id="mixed" aria-label="混合">
  <option value="e">戊</option>
  <option value="f" disabled>己</option>
</select>
<fieldset disabled>
  <legend><button id="legend" type="button">说明</button></legend>
  <button id="submit" type="button">提交</button>
  <input id="note" aria-label="备注">
  <legend><button id="extra" type="button">补充</button></legend>
</fieldset>
<div id="aria-box" aria-disabled="true">
  <button id="aria-button" type="button">停用</button>
  <input id="aria-text" aria-label="停用文本">
  <input id="aria-check" type="checkbox" aria-label="停用勾选">
  <select id="aria-select" aria-label="停用列表">
    <option value="z">子</option>
  </select>
</div>
<div id="shadow-host" aria-disabled="true"></div>
<div id="slot-host"></div>
<script>
  const shadowHost = document.querySelector("#shadow-host");
  const shadowRoot = shadowHost.attachShadow({ mode: "open" });
  shadowRoot.innerHTML = '<div><button id="shadow-button" type="button">影钮</button><input id="shadow-text" aria-label="影文"><input id="shadow-check" type="checkbox" aria-label="影选"><select id="shadow-select"><option>影项</option></select></div>';
  const slotHost = document.querySelector("#slot-host");
  slotHost.attachShadow({ mode: "open" }).innerHTML = '<div aria-disabled="true"><slot></slot></div>';
  const slotted = document.createElement("select");
  slotted.id = "slotted";
  slotted.setAttribute("aria-label", "插槽列表");
  slotted.innerHTML = "<option>寅</option>";
  slotHost.append(slotted);
  document.querySelector("#load").addEventListener("click", () => {
    window.setTimeout(() => {
      const city = document.querySelector("#city");
      city.replaceChildren();
      for (const [value, text] of [["hz", "杭州"], ["nb", "宁波"], ["wz", "温州"]]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        city.append(option);
      }
      city.disabled = false;
      document.querySelector("#province").disabled = false;
      document.querySelector("#route").disabled = true;
    }, 300);
  });
</script>

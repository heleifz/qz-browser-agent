"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","args":{"ids":["2610.18508","2610.17928","2610.17895","2610.17792","2610.17710","2610.17457"],"timeout":180},"argsText":"","argsIncomplete":false,"argsGenerating":false,"argsState":"final","phase":"done","statusText":"","rateLimit":null,"result":{"ok":true,"hasResult":true,"result":{"mode":"ids","requested":6,"rows":[{"title":"Adaptive-Group Process Rewards for GUI Agents","date":"2026-10-13","authors":"Zirui Shang, Yang Liu, Xin Shu et al.","url":"https://arxiv.org/abs/2610.17710","id":"2610.17710","summary":"Training graphical user interface (GUI) agents with reinforcement learning suffers from sparse outcome rewards, leading to inefficient learning. Process rewards offer a promising direction for credit assignment to intermediate actions; however, accurately evaluating an action requires identifying evidence across long-horizon GUI trajectories, as its value may depend on information beyond its immediate state and observation. In this paper, we propose an adaptive-group process reward framework that dynamically partitions a GUI trajectory into semantically coherent subgoal groups, enabling process reward estimation at both the action and group levels. At the action level, a critic evaluates each action based on the visual changes and subsequent actions within the group for action correctness and contribution to the subgoal. At the group level, the framework aggregates action-level evaluations to assess subgoal completion and contribution to the overall task, and further refines these assessments by leveraging the context of all groups in the trajectory. The process reward of each action is obtained by combining its action-level evaluation with the refined group-level evaluation. We further augment GRPO's outcome advantage with the proposed process rewards to provide finer-grained guidance for GUI agent training. Experiments on process reward benchmarks and downstream RL training demonstrate the effectiveness of the proposed framework."},{"title":"Towards Safe Autonomy for Computer Use","date":"2026-10-13","authors":"Dominik Seip, Bartol Markovinović, Matthias Hein","url":"https://arxiv.org/abs/2610.18508","id":"2610.18508","summary":"The safety of LLM-based agents currently rests on alignment training and safety classifiers, neither of which can rule out that a sophisticated indirect prompt injection (IPI) goes through and causes significant harm. Recent work therefore builds agents with information-flow guarantees that rely on structured tool interfaces to interact with the environment. Computer Use Agents (CUAs) act visually on the computer screen, which does not provide a boundary between trusted first-party interfaces and untrusted, potentially attacker-authored content. Actions are equally ambiguous: a click may land on an application toolbar or a button controlled by an attacker. Treating the user as the source of trust and confirming each sensitive decision produces confirmation fatigue, with the risk of missing harmful actions. We introduce SA-CUA, a dual-LLM framework that generates a reliable trust boundary for CUAs by deriving conservative deterministic rules from the accessibility tree for unmasking trusted regions from the privileged LLM's screenshot, keeping trusted and untrusted content separated. Human interaction is only required for proper task specification in the beginning. During the task a robust endorsement channel allows values to pass from the untrusted to the trusted domain by verifying information via trusted channels. This allows the agent to autonomously handle tasks involving untrusted information. SA-CUA maintains much higher utility than CaMeL-CUA while keeping the attack success rate at zero."},{"title":"Interaction-as-a-Judge","date":"2026-10-13","authors":"Wayne Chi, I-Hung Hsu, Li Chen et al.","url":"https://arxiv.org/abs/2610.17895","id":"2610.17895","summary":"Coding agents are tasked with producing sophisticated interactive applications such as websites, desktop applications, and games. While humans assess these applications interactively, current automated LLM evaluations primarily focus on code analysis and unit tests. This mismatch can cause LLM judges to miss failures that are immediately apparent to human users. We study Interaction-as-a-Judge, an evaluation paradigm where computer-use agents (CUAs) directly interact with an application. We demonstrate that Interaction-as-a-Judge can improve both evaluation and generation of interactive applications. To this end, we collect and release two complementary datasets: $6,858$ pairs of applications with human preferences and corresponding agent traces, and $222$ applications with human-verified requirement labels. Relative to standard non-interactive approaches, we find that Interaction-as-a-Judge improves evaluation in terms of predicting human preferences ($65.6\\% \\to 69.1\\%$) and requirement verification ($77.0\\% \\to 81.6\\%$). We also observe scaling benefits: across both preference alignment and requirement verification, higher-quality interactions improve performance. Finally, through both inference- and training-time experiments, we demonstrate that Interaction-as-a-Judge can also improve the quality of generated artifacts. At inference time, Interaction-as-a-Judge repairs $75.5\\%$ of broken requirements within five attempts, compared to $55.4\\%$ for code-only self-feedback. At training time, using Interaction-as-a-Judge as a reward signal improves win-rate over the base model by $6.7$pp while reducing both generated code length by $35.7\\%$ and build failure rates by $7.2$pp compared to a code-only reward signal."},{"title":"Learning How to Remember: Memory Modality Selection for GUI Agents","date":"2026-10-13","authors":"Taeyun Roh, Suhyeong Park, Gijin Kim et al.","url":"https://arxiv.org/abs/2610.17928","id":"2610.17928","summary":"Recent advances in vision-language models (VLMs) have substantially improved the capabilities of GUI agents, while memory augmentation has emerged as a promising approach for reusing knowledge from past interactions. However, existing memory augmented GUI agents typically adopt a fixed representation strategy, providing retrieved experience as a static modality. It remains unclear whether a single memory modality is consistently optimal, or how modality preference changes across interaction steps. In this work, we conduct a systematic study of memory modality in VLM based GUI agents. Across GUI benchmarks, we find that the preferred memory representation is strongly step dependent. Motivated by the finding, we introduce \\textbf{SwitchMem}, a routing framework that dynamically selects between textual and visual memory representations at each step. Across three GUI benchmarks, SwitchMem outperforms memory augmented baselines that rely on static memory representations. Our findings validate our claim that memory modality is a step dependent decision rather than a fixed design choice. Code and project resources are available at https://txxnrd.github.io/switchmem"},{"title":"MHVF: Training-Free GUI Grounding via Verification-Guided Multi-Hypothesis Search","date":"2026-10-13","authors":"Minghua Chen, Xingming Liao, Weiqiang Zhong et al.","url":"https://arxiv.org/abs/2610.17792","id":"2610.17792","summary":"GUI grounding enables web agents to translate natural-language instructions into actionable interface locations. However, dense layouts and small, visually similar controls can lead models toward plausible but incorrect elements, while refinement around a single prediction may leave alternative targets unexplored. We propose the Multi-Hypothesis Verification Framework (MHVF) for training-free GUI grounding. It combines multi-hypothesis exploration with local visual verification using a single pretrained vision-language model. To explore alternative targets, MHVF constructs spatial hypotheses from multiple full-screen predictions and examines the corresponding regions through zoomed re-localization. To resolve ambiguity among the resulting candidates, it verifies their agreement with the instruction in marked local views. Verification scores then guide a second round of local search and rank candidates retained from both search levels for final selection. Experiments with five general-purpose and GUI-specific models across eight benchmark settings demonstrate improvements in grounding accuracy in most settings. MHVF improves UI-Venus-Ground-7B by 4.3 and 2.1 percentage points on Mind2Web and VisualWebBench, respectively, and raises Qwen2.5-VL-7B's accuracy on ScreenSpot-Pro from 23.6% to 53.6%."},{"title":"BrowseSafe++: Benchmarking Prompt Injection Detection Across Web Contexts, Languages, and Browser Views","date":"2026-10-12","authors":"Yuetian Chen, Kaiyuan Zhang, Yuntao Du et al.","url":"https://arxiv.org/abs/2610.17457","id":"2610.17457","summary":"Browser agents need to make decisions and execute actions on behalf of users while consuming untrusted webpages, creating opportunities for malicious instructions embedded in webpages to redirect legitimate tasks. We introduce BrowseSafe++, which extends BrowseSafe from 14,719 pages to 38,675 pairs of pages. Most of its prompt injections were observed in the wild on production websites. We keep each injection unchanged and rewrite the sensitive parts of the page around it to protect privacy. Each attacked page has a clean copy of the same page as its control. Both are provided as HTML, Markdown, an accessibility tree, and a screenshot. Every pair includes a user task and its expected answer. The benchmark includes twelve types of websites, from news articles to shared documents and forums, with 24 attack types appearing in 18 different locations on a page. We use these paired pages to train BrowseSafe-Guard, two 0.8B-parameter detectors for text and screenshots. Both achieve higher F1 scores than the detector based on frontier models, while keeping false-positive rates on benign pages and inference cost low. BrowseSafe-Adapt revises benchmark injections from browser-agent feedback, and attacks that succeed on only a few percent of tasks when replayed directly reach up to 95.41% success once adapted."}],"totalRows":6,"truncated":false,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commentTitlePath":"","commentAuthorPath":"","commentBodyPath":"","commentTimePath":"","commentMeta":[],"language":"","languagePath":"","filenamePath":""}}},"resultType":"object","engine":"offscreen_inner","execution_world":"inner","reason":"inner","trace":[{"time":"2026-10-18T11:05:02.981Z","level":"inner.start","message":"{\"sourceLength\":5565}"}],"elapsedMs":395,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commentTitlePath":"","commentAuthorPath":"","commentBodyPath":"","commentTimePath":"","commentMeta":[],"language":"","languagePath":"","filenamePath":""}}},"isError":false,"isRunning":false,"image":null,"spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:tool:call_00_4tYlvxJ7gWLoRLVCqZHF3315","parentSpanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:5","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","provider":"deepseek","model":"deepseek-flash","eventSeq":2752,"timestamp":"2026-10-18 19:05:02","endedAt":"2026-10-18 19:05:03"},{"type":"thinking","text":"Now remaining 6: 2610.16998 (Glasseek), 2610.16778 (PrivacyGuard), 2610.16720 (Learn from Move), 2610.16402 (EvoWeb), 2610.16319 (HyWe), 2610.16234 (Seg2Click). Also need MAI-Gym rest and GroundGUI beginning (truncated).\n\nFetch these 6 + revisit MAI-Gym/GroundGUI.","spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:6","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","eventSeq":2810,"timestamp":"2026-10-18 19:05:04","endedAt":"2026-10-18 19:05:04"},{"type":"tool","toolCallId":"call_00_pfpqXo3OzGLcgd7t2CGq6910","name":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","args":{"ids":["2610.16998","2610.16778","2610.16720","2610.16402","2610.16319","2610.16234"],"timeout":180},"argsText":"","argsIncomplete":false,"argsGenerating":false,"argsState":"final","phase":"done","statusText":"","rateLimit":null,"result":{"ok":true,"hasResult":true,"result":{"mode":"ids","requested":6,"rows":[{"title":"PrivacyGuard: Source-Linked Sanitization and Locally Resolvable PII References for Cloud GUI Agents","date":"2026-10-12","authors":"Zian Yuan, Wei Li","url":"https://arxiv.org/abs/2610.16778","id":"2610.16778","summary":"Cloud graphical user interface (GUI) agents send instructions and screenshots to remote planners, exposing personally identifiable information (PII). Existing placeholder defenses mask detected spans and reuse exact strings. Fragmented or changed forms can expose PII or break entity continuity across turns. PrivacyGuard addresses this private reference problem with source-linked sanitization (SAN) and a structured reference lifecycle (REF). SAN reconstructs fragmented or overlapping evidence and rewrites the complete source extent. REF links changed appearances to session entities and supports locally resolvable references without returning raw values to the upload path. In five-turn sessions scored against common gold, PrivacyGuard reduces audited source-value leakage by 33.55\\%--82.60\\% relative to the closest prior full-pipeline system in all four reader--language combinations. REF raises strict cross-form continuity from 0.04 under exact-value reuse to 0.81. In reference-required Android tasks, verified completion rises from 8/30 and 7/30 to 17/30 and 20/30. On AndroidLab, PrivacyGuard achieves the highest or tied-highest task-success point estimate among protection pipelines for all four planners. On PrivScreen, it reduces fixed-reader field exposure by 62.72\\%--62.84\\% relative to the same baseline. PrivacyGuard lowers upload exposure while preserving a locally resolvable task path."},{"title":"Glasseek: A Transparent Recipe for Training and Trustworthy Evaluation of DeepSearch Agents","date":"2026-10-12","authors":"Cong Pang, Jiaqi Su, Chengrui Wu et al.","url":"https://arxiv.org/abs/2610.16998","id":"2610.16998","summary":"Deep search enables language agents to solve complex information-seeking tasks through iterative web exploration. However, developing robust open-source agents remains challenging for three reasons. First, opaque trajectory-construction pipelines make training data difficult to audit and reproduce. Second, context compression can create a substantial mismatch between training and inference. Third, agents may retrieve benchmark content from the open web during evaluation, contaminating the results and overstating their performance. To overcome these bottlenecks, we introduce Glasseek, a fully transparent deep search framework spanning the complete development lifecycle, releasing all data, model weights, training recipes, and code. Specifically, for data construction, we establish a verifiable trajectory curation pipeline that systematically generates high-quality exploration paths. For training, we propose Compaction-Managed GSPO (CM-GSPO), which uses the same policy for search and summarization while optimizing only execution sub-trajectories, enabling end-to-end search-policy training across context-compaction boundaries. For evaluation, we conduct the first systematic audit of test-set leakage in open-web agents and release a modular anti-leakage plugin that seamlessly integrates into existing evaluation harnesses. Under this rigorous evaluation protocol, our 9B agent outperforms frontier proprietary agents across almost all deep research benchmarks spanning diverse task types, and achieves the best overall performance among recent open-weight agents, setting a new state of the art at the 9B scale."},{"title":"Learn from Move: the Next Step for GUI Agents","date":"2026-10-12","authors":"Jiahao Lu, Yize Shen, Chuanyuan Tan et al.","url":"https://arxiv.org/abs/2610.16720","id":"2610.16720","summary":"Existing benchmarks for GUI agents primarily focus on increasing task difficulty by extending task horizons. Besides, enabling agents to explore unfamiliar environments and successfully complete tasks within them is also a critical yet challenging problem. We introduce LatentGUIWorld, a benchmark of six tasks in three matched pairs organized by the evidence needed for control: $I_0$ uses prior knowledge and available observations, $I_1$ requires interaction that directly reveals hidden semantics, and $I_2$ identifies dynamics from action-response relationships. Frontier models struggle especially on $I_2$ tasks. We introduce MOVE, which separates movement from button events and exposes intermediate visual feedback, together with demonstrations of iterative exploration and control. Ablations show that both action granularity and multi-step demonstrations improve performance. After SFT, LatentLearner-9B achieves 50.0% overall success on LatentGUIWorld, comparable to several frontier models. Joint RL further raises egocentric Drag and Ten-Choice success to 92.0% and 75.3%. Behavioral analysis reveals multi-step exploration. In egocentric Drag, RL increases Pearson correlation between error-normalized commands and ideal gain compensation from 0.610 to 0.803. Together, these behaviors show that models learn to explore through interaction and adapt their control to environment dynamics. The same format improves GUI grounding after RL, reaching 67.37% mean accuracy across five benchmarks versus 66.72% for conventional RL."},{"title":"Seg2Click: Learning Pixel-Level Action Masks for GUI Visual Grounding","date":"2026-10-12","authors":"Jingchao Wang, Dingjiang Huang","url":"https://arxiv.org/abs/2610.16234","id":"2610.16234","summary":"Visual grounding is a central challenge for GUI agents, requiring an instruction to be mapped to a target within a crowded screenshot. Coordinate generation with single-point supervision reduces a spatially extended target to one position, despite the presence of many valid click locations. Region-based patch scoring alleviates this ambiguity, but its spatial decisions remain tied to visual-token footprints that may span the target, neighboring controls, and background. To address these limitations, we propose Seg2Click, which reformulates GUI grounding as executable-region prediction: identifying where a click can validly execute the given instruction. Using bounding-box supervision, Seg2Click predicts an executable-region mask and computes the final click point through a deterministic rule. This formulation captures the spatial extent of valid click locations and enables finer localization beyond the visual-token grid, making it well suited to small, densely arranged controls without requiring a verifier or zoom-in pass. Experiments across five backbone configurations from two model families demonstrate the effectiveness of Seg2Click. Seg2Click-9B achieves 92.06\\%, 94.10\\%, and 55.22\\% on ScreenSpot, ScreenSpot-v2, and ScreenSpot-Pro, respectively, while matched-backbone comparisons show improvements over both coordinate generation and patch-based grounding. Code will be available at https://github.com/jcwang0602/Seg2Click."},{"title":"EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications","date":"2026-10-12","authors":"David Nukrai, Bar Alon, Nativ Levy et al.","url":"https://arxiv.org/abs/2610.16402","id":"2610.16402","summary":"Web application development often proceeds through successive requests that extend an existing implementation. Yet web-generation benchmarks primarily evaluate development toward fixed specifications. We introduce EvoWeb, a novel benchmark comprising 320 cumulative requests over 32 web applications, grounded in real-world product features and structured by functional dependency graphs. Agents iteratively modify a persistent codebase, while a multimodal web agent tests each intermediate application in a live browser, assessing newly requested functionality, cross-request integration, and previously requested functionality. To characterize reliability throughout development, we integrate trajectory performance across user-tolerance thresholds rather than impose a fixed stopping criterion. Experiments across open- and closed-source frontier models show that EvoWeb reveals clear performance differences between models, with cross-request integration emerging as a key challenge. Further analysis shows that later requests with deeper or more numerous dependencies are solved less accurately, while runtime errors become more frequent over successive requests. EvoWeb provides a testbed for evaluating and improving coding agents in long-horizon, multi-request development."},{"title":"HyWe: Unifying Search and Operation for Real-World Hybrid Web Tasks","date":"2026-10-12","authors":"Zijian Cai, Haowei Liu, Kailai Chen et al.","url":"https://arxiv.org/abs/2610.16319","id":"2610.16319","summary":"Real-world hybrid web tasks need both information gathering and page interaction, yet search-based and operation-based agents are developed and evaluated separately. To bridge this gap, we introduce HyWe, a framework that unifies both capabilities within one model and trajectory. Its two modes use dedicated prompts and tool sets to sustain sub-goal execution; explicit switching selects the needed capability, and shared history lets each mode build on the other's findings. To provide demonstrations of these behaviors, we develop HyWeCollector, a fully automatic pipeline that uses task prototypes, four switching patterns, and multi-agent synthesis to produce verified hybrid trajectories. We train HyWe-35B on these demonstrations to unify efficient information gathering and browser interaction in a single 35B web agent. To evaluate hybrid task completion, we introduce HyWeBench: 100 human-written tasks on websites distinct from training, with human-written sub-goal checklists and an outcome-based evaluation pipeline. Hybrid training enables HyWe-35B to achieve 47.0% success on this benchmark, improving on the untrained base model by 19.0 percentage points and outperforming existing search-based and operation-based agents. Even before training, the same base model solves 28.0% of tasks with HyWe, versus 11.0% with all tools under one prompt. Beyond hybrid tasks, HyWe-35B achieves 59.0% and 88.3% success on Online-Mind2Web and WebVoyager, outperforming existing open-source baselines and cutting action cost per successful task by 48.3% and 51.9% compared with Fara-7B."}],"totalRows":6,"truncated":false,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commen stamp":"2026-10-18 19:05:04","endedAt":"2026-10-18 19:05:05"},{"type":"thinking","text":"Now I need MAI-Gym remainder and GroundGUI beginning (truncated in first batch). Let me fetch just those 2.","spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:7","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","eventSeq":2967,"timestamp":"2026-10-18 19:05:05","endedAt":"2026-10-18 19:05:05"},{"type":"tool","toolCallId":"call_00_nltVKa7MhwQqaUFjeGg09736","name":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","args":{"ids":["2610.20939","2610.19100"],"timeout":120},"argsText":"","argsIncomplete":false,"argsGenerating":false,"argsState":"final","phase":"done","statusText":"","rateLimit":null,"result":{"ok":true,"hasResult":true,"result":{"mode":"ids","requested":2,"rows":[{"title":"MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments","date":"2026-10-14","authors":"Panrong Tong, Quyu Kong, Pengxiang Li et al.","url":"https://arxiv.org/abs/2610.20939","id":"2610.20939","summary":"Online reinforcement learning (RL) with verifiable rewards has driven rapid progress in mathematics, coding, and tool use, but scaling this success to GUI agents remains challenging due to the high cost of interactive environments and the scarcity of realistic training tasks. We introduce MAI-Gym, an open all-in-one platform that unifies GUI agent evaluation, data collection, and online RL training across mobile, computer, and web environments. Through a shared rollout pipeline, MAI-Gym ensures consistent agent behavior across evaluation and training, supports ten established benchmarks, and scales to 20,000 parallel environment instances. Beyond scalable infrastructure, MAI-Gym enables automated synthesis of diverse GUI applications and challenging tasks, including resettable mocked apps and coherent cross-app worlds with execution-validated task verifiers. Using MAI-Gym, we train MAI-Gym-9B, a unified 9B agent for mobile and computer use, achieving state-of-the-art performance among open GUI agents under 10B parameters: 78.4% on MobileWorld and 76.2% on OSWorld-Verified. Importantly, RL in a mocked train-ticketing app transfers to its real-world counterpart, improving task success on a phys- ical phone from 28.8% to 48.1%. We release the framework, synthesis skills, mocked apps, 2,000 verified tasks, and the model checkpoint to support repro- ducible research and further advances in scalable GUI agent training."},{"title":"GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning","date":"2026-10-13","authors":"Qingsong Xie, Jiahao Tian, Jiacheng Tang et al.","url":"https://arxiv.org/abs/2610.19100","id":"2610.19100","summary":"Constructing robust GUI agents relies on multimodal visual grounding: the ability to precisely map natural language intents to actionable on-screen components. Despite abundant desktop, web, and mobile benchmarks, high-fidelity resources tailored for diverse environments are surprisingly scarce. To bridge this gap, we introduce the Screen Referring Grounding Dataset (ScreenRef), a comprehensive GUI grounding dataset consisting of GUI screenshots paired with natural language referring expressions and box or point annotations. Spanning desktop, web, and mobile domains, ScreenRef comprises 586K screenshots and over 633K referring expression instances, covering tasks such as text recognition, visual matching, spatial understanding, and refusal scenarios. To boost the model's grounding performance, we propose the Distillation-to-Reinforcement Learning (D2RL) method to address the limited generalization of supervised fine-tuning and the sparse reward problem in reinforcement learning. Utilizing ScreenRef, we train Qwen3-VL-8B-Instruct via sequential SFT and D2RL training, yielding GroundGUI-8B. GroundGUI-8B achieves 95.2% on ScreenSpot-V2, 63.9% on ScreenSpot-Pro, 65.4% on OSWorld-G, 86.8% on MMBench-GUI L2, and 38.3% on UI-Vision. Among 8B-scale models, it produces substantial gains over models trained on open-source datasets, with performance comparable or even superior to models trained on closed-source data. Code, models, and datasets are available at https://github.com/PrentisAI/GroundGUI."}],"totalRows":2,"truncated":false,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commentTitlePath":"","commentAuthorPath":"","commentBodyPath":"","commentTimePath":"","commentMeta":[],"language":"","languagePath":"","filenamePath":""}}},"resultType":"object","engine":"offscreen_inner","execution_world":"inner","reason":"inner","trace":[{"time":"2026-10-18T11:05:06.079Z","level":"inner.start","message":"{\"sourceLength\":5565}"}],"elapsedMs":339,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commentTitlePath":"","commentAuthorPath":"","commentBodyPath":"","commentTimePath":"","commentMeta":[],"language":"","languagePath":"","filenamePath":""}}},"isError":false,"isRunning":false,"image":null,"spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:tool:call_00_nltVKa7MhwQqaUFjeGg09736","parentSpanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:7","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","provider":"deepseek","model":"deepseek-flash","eventSeq":2995,"timestamp":"2026-10-18 19:05:05","endedAt":"2026-10-18 19:05:06"},{"type":"thinking","text":"I have all 24 in-week papers with full abstracts. Now write the report.\n\n本周 = 2026-10-12（周一）～ 2026-10-18（周日）。表里 27 行含 8 天窗口（从 10-10 起），其中 10-10、10-11 的 3 篇不属于本周，需排除。表本身含 27 行；我在报告里说明 24 篇在本周内。\n\nHmm, better: 表里共 27 条，其中本周（10-12～10-18）24 条。也可以说明表格包含 3 条前一天/两天的边界条目。\n\n现在写一句话结论，按主题分组：\n\n**方向一：开源全栈与训练平台**\n1. OpenGCUA (2610.22200, 10-15) — 全开源通用 computer-use agent 栈，代码执行 + harness-to-model 决策转移，OSWorld-v2 上 8 个模型平均部分分 +19.6，步数 -53.0%。\n2. MAI-Gym (2610.20939, 10-14) — 统一评测/数据/在线 RL 平台，支持 2 万并行实例；训练 MAI-Gym-9B 达 MobileWorld 78.4%、OSWorld-Verified 76.2%，模拟 app 的 RL 迁移到真机把成功率 28.8%→48.1%。\n3. GroundGUI (2610.19100, 10-13) — ScreenRef 58.6万截图 grounding 数据集 + D2RL，GroundGUI-8B ScreenSpot-V2 95.2%、ScreenSpot-Pro 63.9%。\n\n**方向二：成本与推理效率**\n4. LEASH (2610.22280, 10-15) — 用弱模型隐状态不确定性触发弱→强升级（训练-free），OSWorld 上比随机升级高 6.55–11.94 分；Qwen3.5-35B-A3B 73.66% 成功率、$0.4117/task，追平常开 Claude Opus 5 且推理成本 -19.2%。\n5. Why Generate a Click? (2610.20107, 10-14) — 冻结生成器上外挂决策头直接读隐状态选动作类型/目标，严格阈值下精度持平而 12–64% 步数由头决定，WebArena 任务成功率 12.5→13.8%（4B）、13.6→14.6%（8B），token 减半以上。\n6. STP-GUI (2610.20390, 10-14) — 空间连贯的窗口级 token 剪枝，21% token 保留保住 77.7% 性能、延迟 -31%、FLOPs -57%。\n7. WebKD (2610.19834, 10-14) — 黑盒教师当\"批改者\"，最小改动重写失败轨迹并按风格对齐，TimeWarp 上比行为克隆/结果 RL 高 5.5–10.7 分，并迁移到 OnlineMind2Web。\n\n**方向三：执行可控性、可靠性与诊断**\n8. Task-State Governance / TaskVM (2610.20100, 10-14) — 把任务表述为可编辑契约，动作标注可逆/可补偿/不可逆，提升契约合规与恢复控制，任务结果持平。\n9. GraceBench (2610.19900, 10-14) — 用 UI 迁移图做步级稳定性诊断（偏离率/循环负担率/恢复能力），51.24% 的成功轨迹仍含偏离或循环；GPT-5.6 Sol 成功率最高但恢复能力最低。\n10. Reading Right, Acting Wrong (2610.18579, 10-13) — 17 个快速系统上多数错误动作是\"读对了但决策错\"，误差集中在相同状态上；代码组合模型自身答案可修复。\n11. Interaction-as-a-Judge (2610.17895, 10-13) — 让 CUA 直接交互式评估应用，人类偏好预测 65.6%→69.1%，需求验证 77.0%→81.6%；5 次内修复 75.5% 断裂需求（代码自反馈 55.4%）。\n\n**方向四：交互与动作空间、grounding**\n12. OS-Helix (2610.22234, 10-15) — 端到端训练把 GUI 交互与代码执行统一进一个动作空间；初步实验显示\"直接加代码工具\"会退化 GUI 能力。\n13. Player-1 (2610.20584, 10-14) — 用 16 个合成环境 + PPO 从合成经验学游戏控制，Player-1-9B 在 MineDojo-300 比 SFT 提升 27.8 分，成功率 38.33% vs 12.63% 最强基线。\n14. Learn from Move (2610.16720, 10-12) — LatentGUIWorld 基准按所需证据分 I0/I1/I2；MOVE 解耦移动与按键，LatentLearner-9B 达 50.0%，联合 RL 把自中心 Drag 提到 92.0%。\n15. Seg2Click (2610.16234, 10-12) — 把 grounding 变成\"可执行区域\"掩码预测再算点击点，ScreenSpot 92.06%、ScreenSpot-Pro 55.22%。\n16. MHVF (2610.17792, 10-13) — 训练-free 多假设探索 + 局部验证，ScreenSpot-Pro 从 23.6%→53.6%（Qwen2.5-VL-7B）。\n17. SwitchMem (2610.17928, 10-13) — 记忆模态偏好是步级相关的，逐步路由文本/视觉记忆优于静态记忆。\n18. Adaptive-Group Process Rewards (2610.17710, 10-13) — 把轨迹切成子目标组，动作级+组级过程奖励增强 GRPO。\n\n**方向五：安全与隐私**\n19. SA-CUA / Towards Safe Autonomy (2610.18508, 10-13) — 双 LLM + 从 accessibility tree 推导确定性规则划分可信区域，攻击成功率 0 且效用远高于 CaMeL-CUA。\n20. BrowseSafe++ (2610.17457, 10-12) — 38,675 对页面注入基准（HTML/Markdown/AXTree/截图四种视图），0.8B 检测器 F1 超前沿模型；BrowseSafe-Adapt 让低成功率注入达 95.41% 成功率。\n21. PrivacyGuard (2610.16778, 10-12) — 云 GUI agent 的源跨度脱敏 + 本地可解析引用，源值泄漏降 33.55%–82.60%，跨形连续性 0.04→0.81。\n\n**方向六：任务类型扩展**\n22. HyWe (2610.16319, 10-12) — 检索+操作统一在一个模型/轨迹，HyWe-35B 在 HyWeBench 47.0%（+19 分），Online-Mind2Web 59.0%、WebVoyager 88.3%，动作成本降约一半。\n23. EvoWeb (2610.16402, 10-12) — 320 条累积迭代请求/32 个 web 应用，多模态 web agent 在真实浏览器里逐步验收；跨请求集成是主要短板。\n24. Glasseek (2610.16998, 10-12) — 全透明 deep search 训练+评测配方，首次系统审计公开网页测试集泄漏；9B agent 在多数 deep research 基准上超过专有前沿模型。\n\n这也是 24 篇。分组整理，footnote 引用。\n\nFootnotes: 24 篇，每个都用 [^n]。写起来长但可以。\n\n按日期组织还是按主题？按主题更适合\"本周综述\"。我用\"本周主线\"总结 + 分组列表。\n\nCitation: 用 [^1]...[^24]，末尾定义。字数控制。\n\n另外说明：搜索口径（7 条检索式、8 天窗口 2026-10-10 起，共扫描 406 条，去重后 27 条，本周 24 条），表名 arxiv_browser_agent_2026_10_12_2026_10_18。\n\n注意\"本周\"定义：2026-10-12 至 2026-10-18（周一至周日）。今天是周六，周日尚未有论文。所以实际覆盖 10-12～10-15 的提交。\n\n写吧。语言中文，标题保留英文原文。","spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:8","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","eventSeq":3025,"timestamp":"2026-10-18 19:05:07","endedAt":"2026-10-18 19:05:15"},{"type":"assistant","content":"本周（2026-10-12～10-18，周一至周日）arXiv 上与 browser agent 直接相关的论文共 **24 篇**（检索式 7 条，扫描 406 条记录，按 arXiv id 去重后落在本周，另有 3 篇 10-10/10-11 的边界条目已在落库表中但未计入本周清单）。整体看，这一周的主线已经从“做得成”转向 **成本控制、执行可控性与安全边界**：一半以上的工作在解决推理开销、错误归因和注入防护，而不是刷点成功率。\n\n---\n\n### 一、开源全栈与训练基础设施\n1. **OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use**（2026-10-15）—— 首个开源“通用 computer-use”全栈，把代码执行纳入动作空间并提出 harness-to-model 决策转移；OSWorld-v2 上 8 个模型（含 GPT-6 Astra、Claude Opus 5）平均部分分 +19.6，每任务步骤减少 53.0%[^1]\n2. **MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training**（2026-10-14）—— 评测/数据/在线 RL 一套 rollout 管线打通，支持 2 万并行环境；训出的 MAI-Gym-9B 在 MobileWorld 78.4%、OSWorld-Verified 76.2%，且模拟购票 app 上的 RL 迁移到真机把成功率从 28.8% 提到 48.1%[^2]\n3. **GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning**（2026-10-13）—— 发布 586K 截图 / 633K 指代表达的 ScreenRef 数据集与 D2RL 训练法，8B 模型达 ScreenSpot-V2 95.2%、ScreenSpot-Pro 63.9%，接近闭源数据训练水平[^3]\n\n### 二、推理成本与效率\n4. **LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents**（2026-10-15）—— 训练无关：用弱模型隐状态与历史成功/失败轨迹的相似度当不确定性信号，决定何时升级到强模型；OSWorld 上同升级率下比随机升级高 6.55–11.94 分，Qwen3.5-35B-A3B 达 73.66% 成功率、$0.4117/任务，追平常开 Claude Opus 5（72.90%）而推理成本低 19.2%[^4]\n5. **Why Generate a Click? Plug-in Decision Heads for Web Agents**（2026-10-14）—— 不再让模型“生成” click(12)，而是在冻结生成器上挂决策头，从同一次前向的隐状态直接读动作类型与目标框；严格阈值下 12–64% 的步骤由头决定且精度持平，WebArena 任务成功率 12.5→13.8%（4B）、13.6→14.6%（8B），生成 token 不到一半[^5]\n6. **STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents**（2026-10-14）—— 指出通用 token 剪枝会把小控件切碎，改成窗口级空间连贯选择；只保留 21% token 仍保住 77.7% 全量性能，延迟 -31%、FLOPs -57%[^6]\n7. **Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents**（2026-10-14）—— 让黑盒教师当“批改者”，只从首个失误点起用学生自己的风格做最小改写；TimeWarp 上比行为克隆、结果奖励 RL 和教师改写基线高 5.5–10.7 分，并迁移到 OnlineMind2Web[^7]\n\n### 三、执行可控性、稳定性与失败诊断\n8. **Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution**（2026-10-14）—— TaskVM 把任务写成“可编辑契约”（目标 + 必须保持不变的事实 + 观测状态），每个动作标注可逆/可补偿/不可逆；在任务结果持平的前提下提升了契约合规率与用户恢复控制感[^8]\n9. **How GUI Agents Fail: GraceBench for Execution Stability Diagnosis**（2026-10-14）—— 用 UI 迁移图做步级诊断，提出偏离率、循环负担率、恢复能力三个指标；3,718 条轨迹显示 51.24% 的**成功**执行里仍含偏离或循环，GPT-5.6 Sol 成功率最高却恢复能力最低[^9]\n10. **Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops**（2026-10-13）—— 给每个决策配事实探针后发现：17 个快速系统的错误动作大多是“读对了但组合错了”，且越准的系统这种错误占比越高，误差稳定聚集在同一批状态上[^10]\n11. **Interaction-as-a-Judge**（2026-10-13）—— 让 CUA 真的去点应用来当评审：预测人类偏好 65.6%→69.1%、需求核验 77.0%→81.6%；5 次内修复 75.5% 的断裂需求（纯代码自反馈为 55.4%），当奖励信号时胜率 +6.7pp 且代码长度 -35.7%[^11]\n\n### 四、动作空间、Grounding 与记忆\n12. **OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents**（2026-10-15）—— 端到端训练把 GUI 动作与代码执行压进同一动作空间；作者前置实验发现“提示层加个代码工具”反而会让 GUI agent 退化，说明路由必须内化进模型[^12]\n13. **Player-1: Learning to Play from Synthetic Experience**（2026-10-14）—— 用 16 个合成 2D/3D 环境 + PPO 从合成经验学游戏控制；Player-1-9B 在 MineDojo-300 比 SFT 提升 27.8 分，38.33% vs 最强基线 12.63%[^13]\n14. **Learn from Move: the Next Step for GUI Agents**（2026-10-12）—— 提出按“所需证据”分级的 LatentGUIWorld（I₀ 先验 / I₁ 交互揭示 / I₂ 靠动作-响应推断动态），并把移动与按键解耦成 MOVE；LatentLearner-9B 达 50.0%，联合 RL 后自中心 Drag、Ten-Choice 分别到 92.0%/75.3%[^14]\n15. **Seg2Click: Learning Pixel-Level Action Masks for GUI Visual Grounding**（2026-10-12）—— 把 grounding 重构成“可执行区域”掩码预测再定点击点，ScreenSpot 92.06%、ScreenSpot-v2 94.10%、ScreenSpot-Pro 55.22%，无需 verifier 或放大重看[^15]\n16. **MHVF: Training-Free GUI Grounding via Verification-Guided Multi-Hypothesis Search**（2026-10-13）—— 训练无关的多假设探索 + 局部放大验证，把 Qwen2.5-VL-7B 在 ScreenSpot-Pro 上从 23.6% 拉到 53.6%[^16]\n17. **Learning How to Remember: Memory Modality Selection for GUI Agents**（2026-10-13）—— 实证发现“文本记忆还是视觉记忆更好”是**步级相关**的，SwitchMem 逐步路由，在三个 GUI 基准上稳定优于固定模态记忆[^17]\n18. **Adaptive-Group Process Rewards for GUI Agents**（2026-10-13）—— 先把轨迹切成语义子目标组，再做动作级 + 组级过程奖励并注入 GRPO 优势，缓解长程 GUI 的稀疏奖励[^18]\n\n### 五、安全与隐私（本周分量最重的方向之一）\n19. **Towards Safe Autonomy for Computer Use**（2026-10-13）—— SA-CUA 双 LLM 架构：从 accessibility tree 推出确定性规则，把可信区域从截图中“揭开”，并用人审的 endorsement 通道把不可信值送进可信域；攻击成功率保持 0，效用远高于 CaMeL-CUA，任务开始后基本不需人工确认[^19]\n20. **BrowseSafe++: Benchmarking Prompt Injection Detection Across Web Contexts, Languages, and Browser Views**（2026-10-12）—— 38,675 对“注入页 + 干净对照页”，每对同时给 HTML、Markdown、AXTree、截图四种视图；0.8B 检测器 F1 超过前沿模型检测器；BrowseSafe-Adapt 还能把原本成功率个位数的注入提到 95.41%[^20]\n21. **PrivacyGuard: Source-Linked Sanitization and Locally Resolvable PII References for Cloud GUI Agents**（2026-10-12）—— 针对云 GUI agent 上传截图泄漏 PII，做源跨度重建式脱敏 + 会话级可本地解析引用；源值泄漏相对最强基线降 33.55%–82.60%，跨形连续性从 0.04 提到 0.81，AndroidLab 任务成功率仍保持最高或并列最高[^21]\n\n### 六、任务形态扩展\n22. **HyWe: Unifying Search and Operation for Real-World Hybrid Web Tasks**（2026-10-12）—— 把检索与页面操作合到一个模型的同一轨迹里（显式切换 + 共享历史）；HyWe-35B 在 HyWeBench 47.0%（比未训练基线 +19 分），Online-Mind2Web 59.0%、WebVoyager 88.3%，单任务动作成本比 Fara-7B 少 48.3%/51.9%[^22]\n23. **EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications**（2026-10-12）—— 320 条累积迭代请求覆盖 32 个 web 应用，并让多模态 web agent 在真实浏览器里逐请求验收；结果显示“跨请求集成”是核心短板，依赖越深越晚的请求越容易错[^23]\n24. **Glasseek: A Transparent Recipe for Training and Trustworthy Evaluation of DeepSearch Agents**（2026-10-12）—— 全透明 deep search 配方（数据、权重、流程、代码全开），CM-GSPO 让搜索与摘要共用策略并只优化执行子轨迹；同时首次系统审计了开放网页测试集泄漏，9B agent 在多数 deep research 基准上超过专有前沿模型[^24]\n\n---\n\n**可以重点看的三篇**（如果只挑三篇）：LEASH 解决“强模型全开太贵”的实际部署问题且给出成本数字；GraceBench 说明成功率高不等于过程可靠，是评测视角的重要纠偏；BrowseSafe++ 提供了目前最贴近真实浏览器四种视图的注入基准，对做 browser agent 落地的团队直接可用。\n\n**产物**：候选全量已写入 Data 表 `arxiv_browser_agent_2026_10_12_2026_10_18`（27 行，字段：标题/发布日期/链接/作者/摘要，按链接去重），其中本周 24 篇即上表。\n\n**口径与限制**：时间窗按检索时刻（2026-10-18）向前 8 天取超集，报告只保留 2026-10-12 及以后；检索式基于摘要/标题短语匹配，摘要未出现 “browser agent / web agent / GUI agent” 等关键词的论文会漏检；所有一句话结论均来自摘要，未读全文与附录数据。\n\n[^1]: [OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use](https://arxiv.org/abs/2610.22200)\n[^2]: [MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments](https://arxiv.org/abs/2610.20939)\n[^3]: [GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning](https://arxiv.org/abs/2610.19100)\n[^4]: [LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents](https://arxiv.org/abs/2610.22280)\n[^5]: [Why Generate a Click? Plug-in Decision Heads for Web Agents](https://arxiv.org/abs/2610.20107)\n[^6]: [STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents](https://arxiv.org/abs/2610.20390)\n[^7]: [Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents](https://arxiv.org/abs/2610.19834)\n[^8]: [Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution](https://arxiv.org/abs/2610.20100)\n[^9]: [How GUI Agents Fail: GraceBench for Execution Stability Diagnosis](https://arxiv.org/abs/2610.19900)\n[^10]: [Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops](https://arxiv.org/abs/2610.18579)\n[^11]: [Interaction-as-a-Judge](https://arxiv.org/abs/2610.17895)\n[^12]: [OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents](https://arxiv.org/abs/2610.22234)\n[^13]: [Player-1: Learning to Play from Synthetic Experience](https://arxiv.org/abs/2610.20584)\n[^14]: [Learn from Move: the Next Step for GUI Agents](https://arxiv.org/abs/2610.16720)\n[^15]: [Seg2Click: Learning Pixel-Level Action Masks for GUI Visual Grounding](https://arxiv.org/abs/2610.16234)\n[^16]: [MHVF: Training-Free GUI Grounding via Verification-Guided Multi-Hypothesis Search](https://arxiv.org/abs/2610.17792)\n[^17]: [Learning How to Remember: Memory Modality Selection for GUI Agents](https://arxiv.org/abs/2610.17928)\n[^18]: [Adaptive-Group Process Rewards for GUI Agents](https://arxiv.org/abs/2610.17710)\n[^19]: [Towards Safe Autonomy for Computer Use](https://arxiv.org/abs/2610.18508)\n[^20]: [BrowseSafe++: Benchmarking Prompt Injection Detection Across Web Contexts, Languages, and Browser Views](https://arxiv.org/abs/2610.17457)\n[^21]: [PrivacyGuard: Source-Linked Sanitization and Locally Resolvable PII References for Cloud GUI Agents](https://arxiv.org/abs/2610.16778)\n[^22]: [HyWe: Unifying Search and Operation for Real-World Hybrid Web Tasks](https://arxiv.org/abs/2610.16319)\n[^23]: [EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications](https://arxiv.org/abs/2610.16402)\n[^24]: [Glasseek: A Transparent Recipe for

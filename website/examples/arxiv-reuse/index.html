":\"title\"},{\"label\":\"日期\",\"path\":\"date\"},{\"label\":\"作者\",\"path\":\"authors\"},{\"label\":\"链接\",\"path\":\"url\"}],\"itemsPath\":\"rows\",\"totalPath\":\"totalRows\",\"truncatedPath\":\"truncated\",\"itemTitlePath\":\"title\",\"itemSubtitlePath\":\"url\",\"itemMeta\":[],\"authorPath\":\"\",\"timePath\":\"\",\"sourceNamePath\":\"\",\"urlPath\":\"\",\"bodyPath\":\"\",\"bodyFormat\":\"\",\"metaFields\":[],\"commentsPath\":\"\",\"commentsTitle\":\"\",\"commentTitlePath\":\"\",\"commentAuthorPath\":\"\",\"commentBodyPath\":\"\",\"commentTimePath\":\"\",\"commentMeta\":[],\"language\":\"\",\"languagePath\":\"\",\"filenamePath\":\"\"}}}"}},{"type":"message","id":"m_000015","parentId":"m_000014","timestamp":"2026-10-18 19:08:21","message":{"role":"assistant","content":null,"tool_calls":[{"id":"call_00_nltVKa7MhwQqaUFjeGg09736","type":"function","function":{"name":"arxiv_paper_briefing__search_arxiv","arguments":"{\"ids\": [\"2610.20939\", \"2610.19100\"], \"timeout\": 120}"}}],"_usage":{"total_tokens":44718,"prompt_tokens":44614,"completion_tokens":104},"_providerState":{"version":1,"provider":"deepseek","api":"openai-chat-completions","protocol":"openai","endpoint":"https://api.deepseek.com/chat/completions","model":"deepseek-flash","kind":"openai_reasoning","reasoningField":"reasoning_content","reasoningText":"Now I need MAI-Gym remainder and GroundGUI beginning (truncated in first batch). Let me fetch just those 2."},"_usageContextBoundaryId":"root","_usageContextFingerprint":"ctx_35dm_1ay90ixoax0a5"}},{"type":"message","id":"m_000016","parentId":"m_000015","timestamp":"2026-10-18 19:08:21","message":{"role":"tool","tool_call_id":"call_00_nltVKa7MhwQqaUFjeGg09736","content":"{\"ok\":true,\"hasResult\":true,\"result\":{\"mode\":\"ids\",\"requested\":2,\"rows\":[{\"title\":\"MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments\",\"date\":\"2026-10-14\",\"authors\":\"Panrong Tong, Quyu Kong, Pengxiang Li et al.\",\"url\":\"https://arxiv.org/abs/2610.20939\",\"id\":\"2610.20939\",\"summary\":\"Online reinforcement learning (RL) with verifiable rewards has driven rapid progress in mathematics, coding, and tool use, but scaling this success to GUI agents remains challenging due to the high cost of interactive environments and the scarcity of realistic training tasks. We introduce MAI-Gym, an open all-in-one platform that unifies GUI agent evaluation, data collection, and online RL training across mobile, computer, and web environments. Through a shared rollout pipeline, MAI-Gym ensures consistent agent behavior across evaluation and training, supports ten established benchmarks, and scales to 20,000 parallel environment instances. Beyond scalable infrastructure, MAI-Gym enables automated synthesis of diverse GUI applications and challenging tasks, including resettable mocked apps and coherent cross-app worlds with execution-validated task verifiers. Using MAI-Gym, we train MAI-Gym-9B, a unified 9B agent for mobile and computer use, achieving state-of-the-art performance among open GUI agents under 10B parameters: 78.4% on MobileWorld and 76.2% on OSWorld-Verified. Importantly, RL in a mocked train-ticketing app transfers to its real-world counterpart, improving task success on a phys- ical phone from 28.8% to 48.1%. We release the framework, synthesis skills, mocked apps, 2,000 verified tasks, and the model checkpoint to support repro- ducible research and further advances in scalable GUI agent training.\"},{\"title\":\"GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning\",\"date\":\"2026-10-13\",\"authors\":\"Qingsong Xie, Jiahao Tian, Jiacheng Tang et al.\",\"url\":\"https://arxiv.org/abs/2610.19100\",\"id\":\"2610.19100\",\"summary\":\"Constructing robust GUI agents relies on multimodal visual grounding: the ability to precisely map natural language intents to actionable on-screen components. Despite abundant desktop, web, and mobile benchmarks, high-fidelity resources tailored for diverse environments are surprisingly scarce. To bridge this gap, we introduce the Screen Referring Grounding Dataset (ScreenRef), a comprehensive GUI grounding dataset consisting of GUI screenshots paired with natural language referring expressions and box or point annotations. Spanning desktop, web, and mobile domains, ScreenRef comprises 586K screenshots and over 633K referring expression instances, covering tasks such as text recognition, visual matching, spatial understanding, and refusal scenarios. To boost the model's grounding performance, we propose the Distillation-to-Reinforcement Learning (D2RL) method to address the limited generalization of supervised fine-tuning and the sparse reward problem in reinforcement learning. Utilizing ScreenRef, we train Qwen3-VL-8B-Instruct via sequential SFT and D2RL training, yielding GroundGUI-8B. GroundGUI-8B achieves 95.2% on ScreenSpot-V2, 63.9% on ScreenSpot-Pro, 65.4% on OSWorld-G, 86.8% on MMBench-GUI L2, and 38.3% on UI-Vision. Among 8B-scale models, it produces substantial gains over models trained on open-source datasets, with performance comparable or even superior to models trained on closed-source data. Code, models, and datasets are available at https://github.com/PrentisAI/GroundGUI.\"}],\"totalRows\":2,\"truncated\":false,\"_plugin\":{\"id\":\"arxiv-paper-briefing\",\"name\":\"arXiv 论文速览\",\"displayName\":\"arXiv 论文速览\",\"category\":{\"id\":\"research\",\"label\":\"研究\"},\"skillName\":\"arxiv-paper-briefing\",\"tool\":\"arxiv_paper_briefing__search_arxiv\",\"capabilityId\":\"arxiv_paper_briefing__search_arxiv\",\"localName\":\"search_arxiv\",\"title\":\"检索 arXiv 论文\",\"familyId\":\"plugin:research\",\"familyTitle\":\"研究\",\"profileFamily\":\"\",\"resultFamily\":\"generic\",\"labelerId\":\"static\",\"pageContext\":false,\"detailLayout\":\"detail\",\"mediaPresentation\":\"\",\"script\":\"scripts/search-arxiv.js\",\"runtime\":\"inner\",\"mcp\":null, orld 上同升级率下比随机升级高 6.55–11.94 分，Qwen3.5-35B-A3B 达 73.66% 成功率、$0.4117/任务，追平常开 Claude Opus 5（72.90%）而推理成本低 19.2%[^4]\n5. **Why Generate a Click? Plug-in Decision Heads for Web Agents**（2026-10-14）—— 不再让模型“生成” click(12)，而是在冻结生成器上挂决策头，从同一次前向的隐状态直接读动作类型与目标框；严格阈值下 12–64% 的步骤由头决定且精度持平，WebArena 任务成功率 12.5→13.8%（4B）、13.6→14.6%（8B），生成 token 不到一半[^5]\n6. **STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents**（2026-10-14）—— 指出通用 token 剪枝会把小控件切碎，改成窗口级空间连贯选择；只保留 21% token 仍保住 77.7% 全量性能，延迟 -31%、FLOPs -57%[^6]\n7. **Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents**（2026-10-14）—— 让黑盒教师当“批改者”，只从首个失误点起用学生自己的风格做最小改写；TimeWarp 上比行为克隆、结果奖励 RL 和教师改写基线高 5.5–10.7 分，并迁移到 OnlineMind2Web[^7]\n\n### 三、执行可控性、稳定性与失败诊断\n8. **Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution**（2026-10-14）—— TaskVM 把任务写成“可编辑契约”（目标 + 必须保持不变的事实 + 观测状态），每个动作标注可逆/可补偿/不可逆；在任务结果持平的前提下提升了契约合规率与用户恢复控制感[^8]\n9. **How GUI Agents Fail: GraceBench for Execution Stability Diagnosis**（2026-10-14）—— 用 UI 迁移图做步级诊断，提出偏离率、循环负担率、恢复能力三个指标；3,718 条轨迹显示 51.24% 的**成功**执行里仍含偏离或循环，GPT-5.6 Sol 成功率最高却恢复能力最低[^9]\n10. **Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops**（2026-10-13）—— 给每个决策配事实探针后发现：17 个快速系统的错误动作大多是“读对了但组合错了”，且越准的系统这种错误占比越高，误差稳定聚集在同一批状态上[^10]\n11. **Interaction-as-a-Judge**（2026-10-13）—— 让 CUA 真的去点应用来当评审：预测人类偏好 65.6%→69.1%、需求核验 77.0%→81.6%；5 次内修复 75.5% 的断裂需求（纯代码自反馈为 55.4%），当奖励信号时胜率 +6.7pp 且代码长度 -35.7%[^11]\n\n### 四、动作空间、Grounding 与记忆\n12. **OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents**（2026-10-15）—— 端到端训练把 GUI 动作与代码执行压进同一动作空间；作者前置实验发现“提示层加个代码工具”反而会让 GUI agent 退化，说明路由必须内化进模型[^12]\n13. **Player-1: Learning to Play from Synthetic Experience**（2026-10-14）—— 用 16 个合成 2D/3D 环境 + PPO 从合成经验学游戏控制；Player-1-9B 在 MineDojo-300 比 SFT 提升 27.8 分，38.33% vs 最强基线 12.63%[^13]\n14. **Learn from Move: the Next Step for GUI Agents**（2026-10-12）—— 提出按“所需证据”分级的 LatentGUIWorld（I₀ 先验 / I₁ 交互揭示 / I₂ 靠动作-响应推断动态），并把移动与按键解耦成 MOVE；LatentLearner-9B 达 50.0%，联合 RL 后自中心 Drag、Ten-Choice 分别到 92.0%/75.3%[^14]\n15. **Seg2Click: Learning Pixel-Level Action Masks for GUI Visual Grounding**（2026-10-12）—— 把 grounding 重构成“可执行区域”掩码预测再定点击点，ScreenSpot 92.06%、ScreenSpot-v2 94.10%、ScreenSpot-Pro 55.22%，无需 verifier 或放大重看[^15]\n16. **MHVF: Training-Free GUI Grounding via Verification-Guided Multi-Hypothesis Search**（2026-10-13）—— 训练无关的多假设探索 + 局部放大验证，把 Qwen2.5-VL-7B 在 ScreenSpot-Pro 上从 23.6% 拉到 53.6%[^16]\n17. **Learning How to Remember: Memory Modality Selection for GUI Agents**（2026-10-13）—— 实证发现“文本记忆还是视觉记忆更好”是**步级相关**的，SwitchMem 逐步路由，在三个 GUI 基准上稳定优于固定模态记忆[^17]\n18. **Adaptive-Group Process Rewards for GUI Agents**（2026-10-13）—— 先把轨迹切成语义子目标组，再做动作级 + 组级过程奖励并注入 GRPO 优势，缓解长程 GUI 的稀疏奖励[^18]\n\n### 五、安全与隐私（本周分量最重的方向之一）\n19. **Towards Safe Autonomy for Computer Use**（2026-10-13）—— SA-CUA 双 LLM 架构：从 accessibility tree 推出确定性规则，把可信区域从截图中“揭开”，并用人审的 endorsement 通道把不可信值送进可信域；攻击成功率保持 0，效用远高于 CaMeL-CUA，任务开始后基本不需人工确认[^19]\n20. **BrowseSafe++: Benchmarking Prompt Injection Detection Across Web Contexts, Languages, and Browser Views**（2026-10-12）—— 38,675 对“注入页 + 干净对照页”，每对同时给 HTML、Markdown、AXTree、截图四种视图；0.8B 检测器 F1 超过前沿模型检测器；BrowseSafe-Adapt 还能把原本成功率个位数的注入提到 95.41%[^20]\n21. **PrivacyGuard: Source-Linked Sanitization and Locally Resolvable PII References for Cloud GUI Agents**（2026-10-12）—— 针对云 GUI agent 上传截图泄漏 PII，做源跨度重建式脱敏 + 会话级可本地解析引用；源值泄漏相对最强基线降 33.55%–82.60%，跨形连续性从 0.04 提到 0.81，AndroidLab 任务成功率仍保持最高或并列最高[^21]\n\n### 六、任务形态扩展\n22. **HyWe: Unifying Search and Operation for Real-World Hybrid Web Tasks**（2026-10-12）—— 把检索与页面操作合到一个模型的同一轨迹里（显式切换 + 共享历史）；HyWe-35B 在 HyWeBench 47.0%（比未训练基线 +19 分），Online-Mind2Web 59.0%、WebVoyager 88.3%，单任务动作成本比 Fara-7B 少 48.3%/51.9%[^22]\n23. **EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications**（2026-10-12）—— 320 条累积迭代请求覆盖 32 个 web 应用，并让多模态 web agent 在真实浏览器里逐请求验收；结果显示“跨请求集成”是核心短板，依赖越深越晚的请求越容易错[^23]\n24. **Glasseek: A Transparent Recipe for Training and Trustworthy Evaluation of DeepSearch Agents**（2026-10-12）—— 全透明 deep search 配方（数据、权重、流程、代码全开），CM-GSPO 让搜索与摘要共用策略并只优化执行子轨迹；同时首次系统审计了开放网页测试集泄漏，9B agent 在多数 deep research 基准上超过专有前沿模型[^24]\n\n---\n\n**可以重点看的三篇**（如果只挑三篇）：LEASH 解决“强模型全开太贵”的实际部署问题且给出成本数字；GraceBench 说明成功率高不等于过程可靠，是评测视角的重要纠偏；BrowseSafe++ 提供了目前最贴近真实浏览器四种视图的注入基准，对做 browser agent 落地的团队直接可用。\n\n**产物**：候选全量已写入 Data 表 `arxiv_browser_agent_2026_10_12_2026_10_18`（27 行，字段：标题/发布日期/链接/作者/摘要，按链接去重），其中本周 24 篇即上表。\n\n**口径与限制**：时间窗按检索时刻（2026-10-18）向前 8 天取超集，报告只保留 2026-10-12 及以后；检索式基于摘要/标题短语匹配，摘要未出现 “browser agent / web agent / GUI agent” 等关键词的论文会漏检；所有一句话结论均来自摘要，未读全文与附录数据。\n\n[^1]: [OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use](https://arxiv.org/abs/2610.22200)\n[^2]: [MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments](https://arxiv.org/abs/2610.20939)\n[^3]: [GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning](https://arxiv.org/abs/2610.19100)\n[^4]: [LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents](https://arxiv.org/abs/2610.22280)\n[^5]: [Why Generate a Click? Plug-in Decision Heads for Web Agents](https://arxiv.org/abs/2610.20107)\n[^6]: [STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents](https://arxiv.org/abs/2610.20390)\n[^7]: [Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents](https://arxiv.org/abs/2610.19834)\n[^8]: [Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution](https://arxiv.org/abs/2610.20100)\n[^9]: [How GUI Agents Fail: GraceBench for Execution Stability Diagnosis](https://arxiv.org/abs/2610.19900)\n[^10]: [Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops](https://arxiv.org/abs/2610.18579)\n[^11]: [Interaction-as-a-Judge](https://arxiv.org/abs/2610.17895)\n[^12]: [OS-Helix: Unifying GUI Interactio ter: 表里共 27 条，其中本周（10-12～10-18）24 条。也可以说明表格包含 3 条前一天/两天的边界条目。\n\n现在写一句话结论，按主题分组：\n\n**方向一：开源全栈与训练平台**\n1. OpenGCUA (2610.22200, 10-15) — 全开源通用 computer-use agent 栈，代码执行 + harness-to-model 决策转移，OSWorld-v2 上 8 个模型平均部分分 +19.6，步数 -53.0%。\n2. MAI-Gym (2610.20939, 10-14) — 统一评测/数据/在线 RL 平台，支持 2 万并行实例；训练 MAI-Gym-9B 达 MobileWorld 78.4%、OSWorld-Verified 76.2%，模拟 app 的 RL 迁移到真机把成功率 28.8%→48.1%。\n3. GroundGUI (2610.19100, 10-13) — ScreenRef 58.6万截图 grounding 数据集 + D2RL，GroundGUI-8B ScreenSpot-V2 95.2%、ScreenSpot-Pro 63.9%。\n\n**方向二：成本与推理效率**\n4. LEASH (2610.22280, 10-15) — 用弱模型隐状态不确定性触发弱→强升级（训练-free），OSWorld 上比随机升级高 6.55–11.94 分；Qwen3.5-35B-A3B 73.66% 成功率、$0.4117/task，追平常开 Claude Opus 5 且推理成本 -19.2%。\n5. Why Generate a Click? (2610.20107, 10-14) — 冻结生成器上外挂决策头直接读隐状态选动作类型/目标，严格阈值下精度持平而 12–64% 步数由头决定，WebArena 任务成功率 12.5→13.8%（4B）、13.6→14.6%（8B），token 减半以上。\n6. STP-GUI (2610.20390, 10-14) — 空间连贯的窗口级 token 剪枝，21% token 保留保住 77.7% 性能、延迟 -31%、FLOPs -57%。\n7. WebKD (2610.19834, 10-14) — 黑盒教师当\"批改者\"，最小改动重写失败轨迹并按风格对齐，TimeWarp 上比行为克隆/结果 RL 高 5.5–10.7 分，并迁移到 OnlineMind2Web。\n\n**方向三：执行可控性、可靠性与诊断**\n8. Task-State Governance / TaskVM (2610.20100, 10-14) — 把任务表述为可编辑契约，动作标注可逆/可补偿/不可逆，提升契约合规与恢复控制，任务结果持平。\n9. GraceBench (2610.19900, 10-14) — 用 UI 迁移图做步级稳定性诊断（偏离率/循环负担率/恢复能力），51.24% 的成功轨迹仍含偏离或循环；GPT-5.6 Sol 成功率最高但恢复能力最低。\n10. Reading Right, Acting Wrong (2610.18579, 10-13) — 17 个快速系统上多数错误动作是\"读对了但决策错\"，误差集中在相同状态上；代码组合模型自身答案可修复。\n11. Interaction-as-a-Judge (2610.17895, 10-13) — 让 CUA 直接交互式评估应用，人类偏好预测 65.6%→69.1%，需求验证 77.0%→81.6%；5 次内修复 75.5% 断裂需求（代码自反馈 55.4%）。\n\n**方向四：交互与动作空间、grounding**\n12. OS-Helix (2610.22234, 10-15) — 端到端训练把 GUI 交互与代码执行统一进一个动作空间；初步实验显示\"直接加代码工具\"会退化 GUI 能力。\n13. Player-1 (2610.20584, 10-14) — 用 16 个合成环境 + PPO 从合成经验学游戏控制，Player-1-9B 在 MineDojo-300 比 SFT 提升 27.8 分，成功率 38.33% vs 12.63% 最强基线。\n14. Learn from Move (2610.16720, 10-12) — LatentGUIWorld 基准按所需证据分 I0/I1/I2；MOVE 解耦移动与按键，LatentLearner-9B 达 50.0%，联合 RL 把自中心 Drag 提到 92.0%。\n15. Seg2Click (2610.16234, 10-12) — 把 grounding "spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:1","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","eventSeq":1,"timestamp":"2026-10-18 19:04:25","endedAt":"2026-10-18 19:04:25"},{"type":"tool","toolCallId":"call_00_T82ek0OVufhgMsIiGh786693","name":"load_skill","capabilityId":"load_skill","title":"加载技能","familyId":"process","familyTitle":"处理数据","args":{"name":"arxiv-paper-briefing"},"argsText":"","argsIncomplete":false,"argsGenerating":false,"argsState":"final","phase":"done","statusText":"","rateLimit":null,"result":{"name":"arxiv-paper-briefing","displayName":"arXiv 论文速览","description":"按主题与时间窗检索 arXiv，去重筛出 N 篇论文，输出标题、一句话结论、链接，并落库 Data 表","scope":"global","domains":[],"urlPatterns":[],"excludePatterns":[],"status":"active","source":"","builtin":false,"readOnly":false,"updatedAt":"2026-10-18 19:03:48","runtime":"Skill 运行环境是轻舟 Chrome 浏览器扩展，不是 Node.js，也不是服务器。\nMarkdown content 应描述浏览器操作 SOP：页面观察、元素定位、Network/Data/下载/书签等 Skill 工具如何协作。\nMarkdown content 引用 references、模板、示例或其他资源文件时，先用 load_skill_resource(name,path) 按需读取单个文件。\nDOCX、XLSX、PDF 资源由 load_skill_resource 自动解析为 document model；返回 truncated 时加载 qingzhou-documents，并用 document_read_chunk 继续读取。\nscript resources 与 run_script.code 使用同一种源码形态：默认写成 async () => { ... } 函数表达式，由轻舟自动调用；可访问 document/window/Web APIs、input/args、tabId、tools/tool；不能使用 fs/path/process/require、npm 包、服务器文件系统、后台常驻进程或本地 shell。\n需要跨页面动作时，在 Markdown 中指导 agent 拆成普通工具步骤；不要在脚本里直接点击/提交导致当前 frame 卸载。","content":"# arXiv 论文速览\n\n用于「找最近 X 时间某个主题的 N 篇论文，给标题、一句话结论和链接」这类需求。\n已在桌面模式验证：主题 = browser agent，窗口 = 最近一个月，产出 10 篇 + Data 表。\n\n## 前置条件\n\n- 不需要预先打开页面：主流程用 Skill 工具 `search_arxiv`，在轻舟内部 Worker 里直接请求 `https://export.arxiv.org/api/query`。\n- 如果该工具不可用或返回网络错误，走「回退方案」，用页面模式抓同一 API。\n- 时间窗以当前系统时间为基准向前推算，不要用「最近一个月」这类模糊表述直接告知用户，最终报告要写清起止日期。\n\n## 主流程\n\n1. **把需求转成检索式**。按主题拆成若干条 arXiv 摘要字段短语检索，覆盖同义表达，避免单条过窄导致召回不足。以 browser agent 为例：\n   - `abs:\"browser agent\" OR abs:\"browser agents\"`\n   - `abs:\"browser-use\" OR abs:\"browser use agent\"`\n   - `abs:\"web agent\" OR abs:\"web agents\"`\n   - `abs:\"web navigation\" AND abs:\"agent\"`\n   - `ti:\"browser\" AND abs:\"agent\"`\n   - `abs:\"browser automation\" AND abs:\"agent\"`\n   其他领域同样套用：领域名词 + `abs:\"\u003c短语>\"`、`ti:\"\u003c词>\"`、`abs:\"\u003c词>\" AND abs:\"agent\"` 的组合。\n2. **调用 `search_arxiv`**：传 `queries`（检索式数组）、`days`（时间窗天数，默认 30）、`maxResults`（每条检索式取多少，默认 100）；需要留档时再传 `table`。工具会合并所有检索式、按 arXiv id 去重、按时间窗过滤、按提交日期倒序返回候选行（`rows[].summary` 截断在 700 字符；确定选文后再用同一工具的 `ids` 参数回读完整摘要，避免一次性把全部摘要灌进上下文）。\n3. **看候选清单，不要只看顺序**。`rows` 通常有二三十条，先读标题和摘要前几句判断相关性，再按主题均衡挑出目标数量（例如方法/训练、交互范式、安全、评测各取几篇），避免同组作者同系列多篇重复占位。\n4. **写一句话结论**：只能来自摘要里的方法与结果数字，写「做了什么 + 关键量化收益/发现」。摘要里没有数字就不要编数字；不要引用标题里没有的结论。中英文都可，默认中文。\n5. **交付**：分组列出 `N. 标题（英文原文）（日期）` + 一句话结论；正文用 `[^n]` 引用，末尾给 `[^n]: [标题](URL)` 形式的 footnote 定义。链接用 `https://arxiv.org/abs/\u003cid>`（脚本已去掉版本号 `vN`）。\n6. **产物与限制**：给 Data 表名（默认 `arxiv_\u003ctopic>_\u003cstart>_\u003cend>`）、行数、去重口径（链接）、时间窗与检索口径；明确说明「结论取自摘要，未读全文；短语匹配可能漏检摘要未含关键词的论文」。\n\n## 回退方案（Skill 工具不可用时）\n\n1. `open_tab` 打开\n   `https://export.arxiv.org/api/query?search_query=abs%3A%22browser+agent%22&max_results=100&sortBy=submittedDate&sortOrder=descending`。\n2. 用 `run_script`（page 模式）在**同一域** `export.arxiv.org` 内用 `fetch` 依次请求各条检索式（跨域到 `arxiv.org` 会失败），用 `DOMParser` 解析 Atom，按 `id` 去重、按 `published` 过滤时间窗。\n3. 候选较多（>20 条）时，先把全量写入 `tools.data_store`，脚本只返回标题清单，再按需读取单篇摘要，避免把全部摘要灌进上下文。\n4. arXiv 建议请求间隔约 3 秒，批量请求时 `await wait(3000)`。\n\n## arXiv API 要点\n\n- 端点：`https://export.arxiv.org/api/query`；参数 `search_query`、`start`、`max_results`、`sortBy=submittedDate`、`sortOrder=descending`。\n- 字段前缀：`ti:` 标题、`abs:` 摘要、`au:` 作者、`cat:` 分类（如 `cat:cs.AI`）；布尔用 `AND`/`OR`/`ANDNOT`，短语加双引号并 URL 编码。\n- 返回 Atom XML：`\u003centry>` 内 `\u003cid>`（含版本号）、`\u003cpublished>`、`\u003ctitle>`、`\u003csummary>`、`\u003cauthor>\u003cname>`。\n- `published` 是 UTC，跨时区按 UTC 日期判断时间窗即可，报告里统一写成 `YYYY-MM-DD`。\n- Timeout / 429 时降低 `maxResults`、加大间隔重试；仍失败则告知用户并给出可复制的检索 URL。\n\n## 表结构\n\n`table` 参数写入的字段顺序：`标题 / 发布日期 / 链接 / 作者 / 摘要`，`dedupField` 用 `链接`（同 id 不同版本会被折叠）。\n","resources":[{"path":"plugin.json","type":"json","title":"arXiv 论文速览工具清单","description":"声明 search_arxiv 检索工具与表格结果渲染。","size":2665,"hasContent":true},{"path":"scripts/search-arxiv.js","type":"script","title":"search-arxiv.js","description":"在内部 Worker 调用 arXiv Atom API：多检索式合并去重、时间窗过滤、可选落库、按 id 回读全文摘要。","size":5776,"hasContent":true}],"mcpServerCount":0,"mcpToolCount":0,"mcpServers":[]},"isError":false,"isRunning":false,"image":null,"spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:tool:call_00_T82ek0OVufhgMsIiGh786693","parentSpanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:1","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","provider":"deepseek","model":"deepseek-flash","eventSeq":82,"timestamp":"2026-10-18 19:04:25","endedAt":"2026-10-18 19:04:25"},{"type":"thinking","text":"Current date 2026-10-18 (Saturday). \"本周\" = this week. Week start Monday 2026-10-12. But papers \"published\" this week — 7 days window. Actually \"本周\" typically means this calendar week (Mon 2026-10-12 to Sun 2026-10-18). Today is Saturday 2026-10-18. So days=7 would cover 2026-10-11 to 2026-10-18 approximately (days counted back from now). Let me think: the tool computes days back from published. days=7 → 2026-10-11 19:04 onwards. That's close enough but slightly off. Let me use days=8 to safely cover Monday 2026-10-12? Actually days=8 → from 2026-10-10. Then filter manually to >= 2026-10-12 in report.\n\nBetter: call with days=7 and then filter rows to published >= 2026-10-12. But if a paper published 2026-10-11 late UTC... whatever. Let's use days=8 to get a superset, then filter in the report to the week starting 2026-10-12.\n\nLet me call search_arxiv with queries and days, table name.\n\nQueries as suggested. Let me use the browser agent query set.\n\nI'll set days=8, maxResults=100, table arxiv_browser_agent_2026_10_12_2026_10_18.\n\nThen in the script result, rows with summary. Then pick and maybe read full abstracts by ids for selected ones.\n\nLet's start.","spanId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h:llm:2","runId":"run_c3680c125d3c_mvdpx8uu_1_4r5c6z2d5n2h","eventSeq":99,"timestamp":"2026-10-18 19:04:26","endedAt":"2026-10-18 19:04:27"},{"type":"tool","toolCallId":"call_00_PGpeNQ4MpxSfj58EpsI55283","name":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","args":{"timeout":180,"queries":["abs:\"browser agent\" OR abs:\"browser agents\"","abs:\"browser-use\" OR abs:\"browser use agent\"","abs:\"web agent\" OR abs:\"web agents\"","abs:\"web navigation\" AND abs:\"agent\"","ti:\"browser\" AND abs:\"agent\"","abs:\"browser automation\" AND abs:\"agent\"","abs:\"GUI agent\" OR abs:\"computer-use agent\""],"days":8,"maxResults":100,"table":"arxiv_browser_agent_2026_10_12_2026_10_18"},"argsText":"","argsIncomplete":false,"argsGenerating":false,"argsState":"final","phase":"done","statusText":"","rateLimit":null,"result":{"ok":true,"hasResult":true,"result":{"mode":"search","cutoff":"2026-10-10","days":8,"scanned":406,"totalRows":27,"truncated":false,"perQuery":[{"query":"abs:\"browser agent\" OR abs:\"browser agents\"","count":35},{"query":"abs:\"browser-use\" OR abs:\"browser use agent\"","count":54},{"query":"abs:\"web agent\" OR abs:\"web agents\"","count":100},{"query":"abs:\"web navigation\" AND abs:\"agent\"","count":100},{"query":"ti:\"browser\" AND abs:\"agent\"","count":51},{"query":"abs:\"browser automation\" AND abs:\"agent\"","count":16},{"query":"abs:\"GUI agent\" OR abs:\"computer-use agent\"","count":100}],"table":{"table":"arxiv_browser_agent_2026_10_12_2026_10_18","written":27,"total":27},"rows":[{"title":"LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents","date":"2026-10-15","authors":"Qingni Wang, Changdae Oh, Yuzhe Yang et al.","url":"https://arxiv.org/abs/2610.22280","id":"2610.22280","summary":"Computer-use agents increasingly tackle long-horizon tasks, where running a frontier model at every step is expensive and a small open-weight model alone often fails. Weak-to-strong escalation offers a middle ground where a weak agent acts by default and hands control to a strong one only when needed. The core challenge is deciding when to escalate, which requires an uncertainty signal cheap enough to check at every step. However, even after handoff, the strong agent can still get lost, but a black-box API that the strong agent is usually served exposes no internals to monitor. To this end, we propose LEASH, a training-free framework that unleashes the strong agent only when the weak agent's …"},{"title":"OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents","date":"2026-10-15","authors":"Bowen Yang, Kaiming Jin, Zichen Ding et al.","url":"https://arxiv.org/abs/2610.22234","id":"2610.22234","summary":"Real desktop automation is neither purely visual nor purely programmatic. Agents must understand user-facing interfaces while efficiently manipulating files, scripts, and system state. However, native GUI/code coordination cannot be obtained by prompt-level tool composition. In our preliminary experiments, naively adding a code tool degrades a GUI agent, revealing that GUI/code routing must be internalized through training on high-quality hybrid data. We present OS-Helix, an end-to-end trained multimodal computer-using agent that unifies GUI actions and code execution in one action space. To construct the required supervision, we introduce application-artifact composition, pairing desktop ap …"},{"title":"OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use","date":"2026-10-15","authors":"Hanzhang Zhou, Long Li, Quyu Kong et al.","url":"https://arxiv.org/abs/2610.22200","id":"2610.22200","summary":"Computer use has reached a turning point: the focus is expanding from GUI-only interaction to systems that complete tasks on users' computers through visual and programmatic interfaces. We define a generalist computer-use agent (GCUA) as a system in which the model chooses how to observe, act, and organize its work across visual and programmatic interfaces. Yet frontier implementations, such as GPT-6 Astra's computer-use system, remain largely closed, limiting systematic study of their design. We introduce Open Generalist CUA (OpenGCUA), an ongoing project to develop and open the full stack for GCUAs with the community. This report presents the first release of OpenGCUA. Code execution is a  …"},{"title":"MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments","date":"2026-10-14","authors":"Panrong Tong, Quyu Kong, Pengxiang Li et al.","url":"https://arxiv.org/abs/2610.20939","id":"2610.20939","summary":"Online reinforcement learning (RL) with verifiable rewards has driven rapid progress in mathematics, coding, and tool use, but scaling this success to GUI agents remains challenging due to the high cost of interactive environments and the scarcity of realistic training tasks. We introduce MAI-Gym, an open all-in-one platform that unifies GUI agent evaluation, data collection, and online RL training across mobile, computer, and web environments. Through a shared rollout pipeline, MAI-Gym ensures consistent agent behavior across evaluation and training, supports ten established benchmarks, and scales to 20,000 parallel environment instances. Beyond scalable infrastructure, MAI-Gym enables auto …"},{"title":"Player-1: Learning to Play from Synthetic Experience","date":"2026-10-14","authors":"Mingyu Ouyang, Yiran Wang, Siyuan Hu et al.","url":"https://arxiv.org/abs/2610.20584","id":"2610.20584","summary":"Computer-use agents have demonstrated strong capabilities in interpreting screens and executing keyboard and mouse actions. However, games, with their visually rich worlds and diverse mechanics, remain challenging and offer a demanding next step toward general digital control. Current game-agent learning pipelines often rely on large-scale demonstrations with limited coverage of dynamic game states, while scalable environments for interactive training remain difficult to obtain. We introduce Player-1, a post-training framework for learning game control beyond demonstrations through synthetic experience. We extend the computer-use action space with relative pointer motion, sustained inputs, a …"},{"title":"STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents","date":"2026-10-14","authors":"Shuo Wang, Sifan Zhou, Xiaobo Wang et al.","url":"https://arxiv.org/abs/2610.20390","id":"2610.20390","summary":"With the rapid development of vision-language models (VLMs), Web-GUI agents have achieved promising performance in interacting with real-world interfaces through screenshot-based grounding. However, high-resolution screenshots and multi-turn histories introduce excessive visual tokens, causing substantial inference overhead. Existing token pruning methods, mainly designed for natural images, often select tokens independently based on importance scores, which can fragment the local visual structures required for recognizing small GUI elements such as buttons, icons, and hyperlinks. In this work, we propose STP-GUI (Spatially-aware Token Pruning for GUI agents), a query-guided token pruning fr …"},{"title":"Why Generate a Click? Plug-in Decision Heads for Web Agents","date":"2026-10-14","authors":"Chengguang Gan, Yunhao Liang, Hanjun Wei et al.","url":"https://arxiv.org/abs/2610.20107","id":"2610.20107","summary":"Web agents built on vision language models decide every action by generating text such as click(12), although most of that text encodes a choice among a few action types and a few dozen marked elements. We read these choices directly from the hidden states that the generator computes while it reads the goal and the screenshot. Plug-in decision heads on a frozen generator predict the action type, pool the visual tokens inside each numbered box to pick the target, and point at a listed text option or at a WRITE slot that leaves the writing of new text to the generator. A confidence cascade executes the heads' action when they are sure and otherwise lets the generator decode from the KV cache o …"},{"title":"Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution","date":"2026-10-14","authors":"Wenkui Yang, Yiming Hao, Kai Zhou et al.","url":"https://arxiv.org/abs/2610.20100","id":"2610.20100","summary":"Graphical user interface (GUI) agents now execute workflows across real applications, but when execution drifts, users must determine what changed, what should have remained untouched, and what can still be recovered. Plan-centric interfaces leave users supervising procedure, but users live with changes to application state. We introduce task-state governance, an interaction paradigm that represents a task as an editable contract linking desired outcomes, facts that must be preserved, and observed application state. We instantiate this paradigm in TaskVM, which projects live state into editable task controls, executes user edits as genuine interface actions, verifies outcomes through indepen …"},{"title":"How GUI Agents Fail: GraceBench for Execution Stability Diagnosis","date":"2026-10-14","authors":"Ridong Zhang, Shuxian Liang, Chaoqun Wan et al.","url":"https://arxiv.org/abs/2610.19900","id":"2610.19900","summary":"As GUI agents are increasingly deployed for mobile task automation, their reliability depends not only on final task outcomes, but also on whether they reach these outcomes through stable interaction trajectories. In automation workflows, unnecessary actions, detours, and execution errors can add noise to collected data, introduce irreversible side effects, or undermine trust, even when the agent eventually completes the task. It is therefore important to systematically diagnose the execution stability, including whether an agent deviates from a feasible path, enters a loop, becomes stagnant, or recovers from unstable actions. Existing benchmarks, however, primarily assess final task success …"},{"title":"Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents","date":"2026-10-14","authors":"Md Farhan Ishmam, Kenneth Marino","url":"https://arxiv.org/abs/2610.19834","id":"2610.19834","summary":"Frontier web agents using closed models have high inference and computational costs. Smaller open models can be an alternative, but to be performant, they require training supervision from a human or teacher model. Token-level teacher distillation is not an option for closed teachers as it needs access to the model's logits. The standard approach is to imitate teacher demonstrations offline, but it trains the student on states it has never visited, and in a style it does not write in. We introduce WebKD, where the teacher is the editor of the student's failures. Given a failed episode, the teacher finds the first point of mistake, and rewrites the student's reasoning traces, harness states,  …"},{"title":"GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning","date":"2026-10-13","authors":"Qingsong Xie, Jiahao Tian, Jiacheng Tang et al.","url":"https://arxiv.org/abs/2610.19100","id":"2610.19100","summary":"Constructing robust GUI agents relies on multimodal visual grounding: the ability to precisely map natural language intents to actionable on-screen components. Despite abundant desktop, web, and mobile benchmarks, high-fidelity resources tailored for diverse environments are surprisingly scarce. To bridge this gap, we introduce the Screen Referring Grounding Dataset (ScreenRef), a comprehensive GUI grounding dataset consisting of GUI screenshots paired with natural language referring expressions and box or point annotations. Spanning desktop, web, and mobile domains, ScreenRef comprises 586K screenshots and over 633K referring expression instances, covering tasks such as text recognition, vi …"},{"title":"Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops","date":"2026-10-13","authors":"Yubo Li, Ramayya Krishnan, Rema Padman","url":"https://arxiv.org/abs/2610.18579","id":"2610.18579","summary":"System One models choose an agent's next action by scoring a supplied set of options in a single pass. This makes them fast and cheap, but when they choose wrongly there is nothing to inspect: did the model misread what the agent has seen, or read it correctly and still act wrongly? We answer behaviorally. On a frozen benchmark of agent decision states from simulated environments, customer-service policies, tool use, web navigation and coding, we pair every next-action question with factual probes about the same state, each answered independently. Across seventeen fast systems and a reasoning model, the answer is consistent: most wrong actions follow correct reading, and the more accurate a  …"},{"title":"Towards Safe Autonomy for Computer Use","date":"2026-10-13","authors":"Dominik Seip, Bartol Markovinović, Matthias Hein","url":"https://arxiv.org/abs/2610.18508","id":"2610.18508","summary":"The safety of LLM-based agents currently rests on alignment training and safety classifiers, neither of which can rule out that a sophisticated indirect prompt injection (IPI) goes through and causes significant harm. Recent work therefore builds agents with information-flow guarantees that rely on structured tool interfaces to interact with the environment. Computer Use Agents (CUAs) act visually on the computer screen, which does not provide a boundary between trusted first-party interfaces and untrusted, potentially attacker-authored content. Actions are equally ambiguous: a click may land on an application toolbar or a button controlled by an attacker. Treating the user as the source of  …"},{"title":"Learning How to Remember: Memory Modality Selection for GUI Agents","date":"2026-10-13","authors":"Taeyun Roh, Suhyeong Park, Gijin Kim et al.","url":"https://arxiv.org/abs/2610.17928","id":"2610.17928","summary":"Recent advances in vision-language models (VLMs) have substantially improved the capabilities of GUI agents, while memory augmentation has emerged as a promising approach for reusing knowledge from past interactions. However, existing memory augmented GUI agents typically adopt a fixed representation strategy, providing retrieved experience as a static modality. It remains unclear whether a single memory modality is consistently optimal, or how modality preference changes across interaction steps. In this work, we conduct a systematic study of memory modality in VLM based GUI agents. Across GUI benchmarks, we find that the preferred memory representation is strongly step dependent. Motivated …"},{"title":"Interaction-as-a-Judge","date":"2026-10-13","authors":"Wayne Chi, I-Hung Hsu, Li Chen et al.","url":"https://arxiv.org/abs/2610.17895","id":"2610.17895","summary":"Coding agents are tasked with producing sophisticated interactive applications such as websites, desktop applications, and games. While humans assess these applications interactively, current automated LLM evaluations primarily focus on code analysis and unit tests. This mismatch can cause LLM judges to miss failures that are immediately apparent to human users. We study Interaction-as-a-Judge, an evaluation paradigm where computer-use agents (CUAs) directly interact with an application. We demonstrate that Interaction-as-a-Judge can improve both evaluation and generation of interactive applications. To this end, we collect and release two complementary datasets: $6,858$ pairs of application …"},{"title":"MHVF: Training-Free GUI Grounding via Verification-Guided Multi-Hypothesis Search","date":"2026-10-13","authors":"Minghua Chen, Xingming Liao, Weiqiang Zhong et al.","url":"https://arxiv.org/abs/2610.17792","id":"2610.17792","summary":"GUI grounding enables web agents to translate natural-language instructions into actionable interface locations. However, dense layouts and small, visually similar controls can lead models toward plausible but incorrect elements, while refinement around a single prediction may leave alternative targets unexplored. We propose the Multi-Hypothesis Verification Framework (MHVF) for training-free GUI grounding. It combines multi-hypothesis exploration with local visual verification using a single pretrained vision-language model. To explore alternative targets, MHVF constructs spatial hypotheses from multiple full-screen predictions and examines the corresponding regions through zoomed re-locali …"},{"title":"Adaptive-Group Process Rewards for GUI Agents","date":"2026-10-13","authors":"Zirui Shang, Yang Liu, Xin Shu et al.","url":"https://arxiv.org/abs/2610.17710","id":"2610.17710","summary":"Training graphical user interface (GUI) agents with reinforcement learning suffers from sparse outcome rewards, leading to inefficient learning. Process rewards offer a promising direction for credit assignment to intermediate actions; however, accurately evaluating an action requires identifying evidence across long-horizon GUI trajectories, as its value may depend on information beyond its immediate state and observation. In this paper, we propose an adaptive-group process reward framework that dynamically partitions a GUI trajectory into semantically coherent subgoal groups, enabling process reward estimation at both the action and group levels. At the action level, a critic evaluates eac …"},{"title":"BrowseSafe++: Benchmarking Prompt Injection Detection Across Web Contexts, Languages, and Browser Views","date":"2026-10-12","authors":"Yuetian Chen, Kaiyuan Zhang, Yuntao Du et al.","url":"https://arxiv.org/abs/2610.17457","id":"2610.17457","summary":"Browser agents need to make decisions and execute actions on behalf of users while consuming untrusted webpages, creating opportunities for malicious instructions embedded in webpages to redirect legitimate tasks. We introduce BrowseSafe++, which extends BrowseSafe from 14,719 pages to 38,675 pairs of pages. Most of its prompt injections were observed in the wild on production websites. We keep each injection unchanged and rewrite the sensitive parts of the page around it to protect privacy. Each attacked page has a clean copy of the same page as its control. Both are provided as HTML, Markdown, an accessibility tree, and a screenshot. Every pair includes a user task and its expected answer. …"},{"title":"Glasseek: A Transparent Recipe for Training and Trustworthy Evaluation of DeepSearch Agents","date":"2026-10-12","authors":"Cong Pang, Jiaqi Su, Chengrui Wu et al.","url":"https://arxiv.org/abs/2610.16998","id":"2610.16998","summary":"Deep search enables language agents to solve complex information-seeking tasks through iterative web exploration. However, developing robust open-source agents remains challenging for three reasons. First, opaque trajectory-construction pipelines make training data difficult to audit and reproduce. Second, context compression can create a substantial mismatch between training and inference. Third, agents may retrieve benchmark content from the open web during evaluation, contaminating the results and overstating their performance. To overcome these bottlenecks, we introduce Glasseek, a fully transparent deep search framework spanning the complete development lifecycle, releasing all data, mo …"},{"title":"PrivacyGuard: Source-Linked Sanitization and Locally Resolvable PII References for Cloud GUI Agents","date":"2026-10-12","authors":"Zian Yuan, Wei Li","url":"https://arxiv.org/abs/2610.16778","id":"2610.16778","summary":"Cloud graphical user interface (GUI) agents send instructions and screenshots to remote planners, exposing personally identifiable information (PII). Existing placeholder defenses mask detected spans and reuse exact strings. Fragmented or changed forms can expose PII or break entity continuity across turns. PrivacyGuard addresses this private reference problem with source-linked sanitization (SAN) and a structured reference lifecycle (REF). SAN reconstructs fragmented or overlapping evidence and rewrites the complete source extent. REF links changed appearances to session entities and supports locally resolvable references without returning raw values to the upload path. In five-turn session …"},{"title":"Learn from Move: the Next Step for GUI Agents","date":"2026-10-12","authors":"Jiahao Lu, Yize Shen, Chuanyuan Tan et al.","url":"https://arxiv.org/abs/2610.16720","id":"2610.16720","summary":"Existing benchmarks for GUI agents primarily focus on increasing task difficulty by extending task horizons. Besides, enabling agents to explore unfamiliar environments and successfully complete tasks within them is also a critical yet challenging problem. We introduce LatentGUIWorld, a benchmark of six tasks in three matched pairs organized by the evidence needed for control: $I_0$ uses prior knowledge and available observations, $I_1$ requires interaction that directly reveals hidden semantics, and $I_2$ identifies dynamics from action-response relationships. Frontier models struggle especially on $I_2$ tasks. We introduce MOVE, which separates movement from button events and exposes inter …"},{"title":"EvoWeb: A Benchmark for Coding Agents on Evolving Web Applications","date":"2026-10-12","authors":"David Nukrai, Bar Alon, Nativ Levy et al.","url":"https://arxiv.org/abs/2610.16402","id":"2610.16402","summary":"Web application development often proceeds through successive requests that extend an existing implementation. Yet web-generation benchmarks primarily evaluate development toward fixed specifications. We introduce EvoWeb, a novel benchmark comprising 320 cumulative requests over 32 web applications, grounded in real-world product features and structured by functional dependency graphs. Agents iteratively modify a persistent codebase, while a multimodal web agent tests each intermediate application in a live browser, assessing newly requested functionality, cross-request integration, and previously requested functionality. To characterize reliability throughout development, we integrate traje …"},{"title":"HyWe: Unifying Search and Operation for Real-World Hybrid Web Tasks","date":"2026-10-12","authors":"Zijian Cai, Haowei Liu, Kailai Chen et al.","url":"https://arxiv.org/abs/2610.16319","id":"2610.16319","summary":"Real-world hybrid web tasks need both information gathering and page interaction, yet search-based and operation-based agents are developed and evaluated separately. To bridge this gap, we introduce HyWe, a framework that unifies both capabilities within one model and trajectory. Its two modes use dedicated prompts and tool sets to sustain sub-goal execution; explicit switching selects the needed capability, and shared history lets each mode build on the other's findings. To provide demonstrations of these behaviors, we develop HyWeCollector, a fully automatic pipeline that uses task prototypes, four switching patterns, and multi-agent synthesis to produce verified hybrid trajectories. We tr …"},{"title":"Seg2Click: Learning Pixel-Level Action Masks for GUI Visual Grounding","date":"2026-10-12","authors":"Jingchao Wang, Dingjiang Huang","url":"https://arxiv.org/abs/2610.16234","id":"2610.16234","summary":"Visual grounding is a central challenge for GUI agents, requiring an instruction to be mapped to a target within a crowded screenshot. Coordinate generation with single-point supervision reduces a spatially extended target to one position, despite the presence of many valid click locations. Region-based patch scoring alleviates this ambiguity, but its spatial decisions remain tied to visual-token footprints that may span the target, neighboring controls, and background. To address these limitations, we propose Seg2Click, which reformulates GUI grounding as executable-region prediction: identifying where a click can validly execute the given instruction. Using bounding-box supervision, Seg2Cl …"},{"title":"Visible but Not Avoided: State-Dependent Re-Proposal of Rejected Candidates in Catalog-Based LLM Optimization Loops","date":"2026-10-11","authors":"Jianlin Chen, Wenhui Chen, Chi Man Vong","url":"https://arxiv.org/abs/2610.15738","id":"2610.15738","summary":"LLM optimization loops often show the proposer the candidates it has already tried and rejected, but leave it to the proposer to avoid them. We ask whether avoidance measured in a static probe predicts avoidance in the states an optimizer's own trajectory produces. In catalog-based loops where three open LLMs improve a GUI agent by naming one of 40 edits, a re-proposal is identified exactly by the edit's name. Clean base-state probes underpredict re-proposal in the proposers' own loops (macro-averaged loop-minus-probe rate 0.32 [0.27, 0.37]), and proposals of already evaluated harness-edit pairs consume 28-63% of valid proposer iterations. The two settings reject different edits: a probe's r …"},{"title":"The Agent Clicks Approve: Injected Page Text Makes Browser Agents Authorize Access the Task Never Named","date":"2026-10-10","authors":"Md Imran Hossen","url":"https://arxiv.org/abs/2610.15138","id":"2610.15138","summary":"A browser agent that works in its user's signed-in session can be steered by a two-sentence note on a page it reads into approving a third party's access to the user's account. The agent is a confused deputy: the session supplies the authority, the page designates the access request to approve or the webhook URL to register, and nothing at the point of action checks one against the other. The agent thereby supplies the approval click that a consent screen reserves for the account holder. We measure this failure on two authorization surfaces, an OAuth-style access grant and a webhook registration, with agents built on an open-source browser framework and models from two providers. Without a d …"},{"title":"PEAM: On-device Communication Agent for Personalized, Efficient and Autonomous Mobile Network Configuration","date":"2026-10-10","authors":"Haowen Wan, Shangzhuo Xie, Syue-Ju Syue et al.","url":"https://arxiv.org/abs/2610.14855","id":"2610.14855","summary":"The growing deployment of compact large language models on smartphones is enabling autonomous on-device decision-making, such as emerging mobile GUI agents. However, many mobile decisions, such as network configuration when users switch apps or connectivity conditions change, must satisfy stringent latency constraints to preserve user experience. In this paper, we propose PEAM, an on-device LLM-based communication agent that autonomously generates personalized network-configuration rules executable within milliseconds. Specifically, PEAM first fine-tune the on-device LLM with a dataset constructed from manually annotated real-user data to integrate the communication knowledge into the local  …"}],"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath" ,"result":{"mode":"ids","requested":12,"rows":[{"title":"Task-State Governance: A Virtual Machine for Verifiable and Recoverable GUI Agent Execution","date":"2026-10-14","authors":"Wenkui Yang, Yiming Hao, Kai Zhou et al.","url":"https://arxiv.org/abs/2610.20100","id":"2610.20100","summary":"Graphical user interface (GUI) agents now execute workflows across real applications, but when execution drifts, users must determine what changed, what should have remained untouched, and what can still be recovered. Plan-centric interfaces leave users supervising procedure, but users live with changes to application state. We introduce task-state governance, an interaction paradigm that represents a task as an editable contract linking desired outcomes, facts that must be preserved, and observed application state. We instantiate this paradigm in TaskVM, which projects live state into editable task controls, executes user edits as genuine interface actions, verifies outcomes through independent observation, and marks each action as reversible, compensatable, or irreversible. Across an automated contract benchmark, a controlled user study, and an open live-model exploration, the paradigm strengthened contract compliance and users' recovery control and trust, while execution outcomes were held constant. Task contracts open a design space for governable agent interfaces."},{"title":"Teaching Agents in their Own Style: Blackbox Teacher Distillation for Web Agents","date":"2026-10-14","authors":"Md Farhan Ishmam, Kenneth Marino","url":"https://arxiv.org/abs/2610.19834","id":"2610.19834","summary":"Frontier web agents using closed models have high inference and computational costs. Smaller open models can be an alternative, but to be performant, they require training supervision from a human or teacher model. Token-level teacher distillation is not an option for closed teachers as it needs access to the model's logits. The standard approach is to imitate teacher demonstrations offline, but it trains the student on states it has never visited, and in a style it does not write in. We introduce WebKD, where the teacher is the editor of the student's failures. Given a failed episode, the teacher finds the first point of mistake, and rewrites the student's reasoning traces, harness states, and actions from that point onward. The editing reveals that the teacher's corrections can be more surprising to the student than the student's own text. WebKD instead aims to edit minimally. In the data space, the teacher writes each correction in the student's style. In the objective space, the reasoning is weighted by its contribution to the action. A role-asymmetric KL anchor allows the corrected action to move freely while keeping the reasoning near the student's prior. On the TimeWarp benchmark, WebKD students gain about 5.5-10.7 pp over behavior cloning, outcome-reward RL, and teacher editing baselines. The performance transfers to unseen versions and to the live web in the OnlineMind2Web benchmark. WebKD opens a new way of distilling black-box models to improve the capabilities of open-weight web agents."},{"title":"OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use","date":"2026-10-15","authors":"Hanzhang Zhou, Long Li, Quyu Kong et al.","url":"https://arxiv.org/abs/2610.22200","id":"2610.22200","summary":"Computer use has reached a turning point: the focus is expanding from GUI-only interaction to systems that complete tasks on users' computers through visual and programmatic interfaces. We define a generalist computer-use agent (GCUA) as a system in which the model chooses how to observe, act, and organize its work across visual and programmatic interfaces. Yet frontier implementations, such as GPT-6 Astra's computer-use system, remain largely closed, limiting systematic study of their design. We introduce Open Generalist CUA (OpenGCUA), an ongoing project to develop and open the full stack for GCUAs with the community. This report presents the first release of OpenGCUA. Code execution is a key feature of our agent design: it lets intermediate results determine subsequent operations and enables models to apply their existing programming capabilities directly to computer interaction. We also propose harness-to-model decision transfer, moving selected observations and task-state decisions from fixed harness rules to the model. On OSWorld-v2, our full configuration improves task scores across all eight evaluated models, including GPT-6 Astra and Claude Opus 5, raising mean partial score by +19.6 points and reducing reported steps per task by an average of 53.0% relative to batched GUI-only execution. We release our implementation and prompts, evaluation trajectories from all eight models, and preliminary versions of a real-device harness and a cross-device SDK. The harness addresses real-device challenges not fully captured by benchmarks, while the SDK provides a common programming interface across computers, mobiles and browsers. Across four real macOS tasks under our real-device harness, selected Qwen3.8-Max runs use 19.4 times as many reported reasoning tokens as GPT-6 Astra, highlighting substantial differences between models in real-device execution efficiency."},{"title":"LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents","date":"2026-10-15","authors":"Qingni Wang, Changdae Oh, Yuzhe Yang et al.","url":"https://arxiv.org/abs/2610.22280","id":"2610.22280","summary":"Computer-use agents increasingly tackle long-horizon tasks, where running a frontier model at every step is expensive and a small open-weight model alone often fails. Weak-to-strong escalation offers a middle ground where a weak agent acts by default and hands control to a strong one only when needed. The core challenge is deciding when to escalate, which requires an uncertainty signal cheap enough to check at every step. However, even after handoff, the strong agent can still get lost, but a black-box API that the strong agent is usually served exposes no internals to monitor. To this end, we propose LEASH, a training-free framework that unleashes the strong agent only when the weak agent's latent uncertainty signals it is needed, and keeps it on a leash afterward. LEASH has three layers: (1) initial task uncertainty for early routing, (2) step-level uncertainty for runtime escalation, and, after handoff, (3) a shadow observer for continued oversight of the strong black-box agent. Here, we use latent uncertainty as a fuel for all three layers. Specifically, we compare the weak model's hidden states with those from its past successful and failed trajectories, and a state that looks more like the failures signals higher uncertainty. During weak-agent execution, our uncertainty estimator reuses activations already produced during action generation, so it needs no extra forward pass or dedicated monitor training. Experiments on OSWorld across four contemporary model backbones show that LEASH consistently improves over standalone weak agents and outperforms random escalation by 6.55--11.94 points at matched escalation rates. With Qwen3.5-35B-A3B, LEASH achieves 73.66% task success at $0.4117 per task, matching always-on Claude Opus 5 (72.90%) while reducing inference cost by 19.2%."},{"title":"Reading Right, Acting Wrong: Diagnosing Decision Failures of System One Models in Agent Loops","date":"2026-10-13","authors":"Yubo Li, Ramayya Krishnan, Rema Padman","url":"https://arxiv.org/abs/2610.18579","id":"2610.18579","summary":"System One models choose an agent's next action by scoring a supplied set of options in a single pass. This makes them fast and cheap, but when they choose wrongly there is nothing to inspect: did the model misread what the agent has seen, or read it correctly and still act wrongly? We answer behaviorally. On a frozen benchmark of agent decision states from simulated environments, customer-service policies, tool use, web navigation and coding, we pair every next-action question with factual probes about the same state, each answered independently. Across seventeen fast systems and a reasoning model, the answer is consistent: most wrong actions follow correct reading, and the more accurate a system, the more of its errors take this form. These errors are not noise; they gather on the same states across systems of every kind. Where the probed facts provably determine the action, models that read every fact still fail to combine them, and their own answers, composed by code, repair the failure. On real states, what is missing is often not a fact but the next sub-goal."},{"title":"Player-1: Learning to Play from Synthetic Experience","date":"2026-10-14","authors":"Mingyu Ouyang, Yiran Wang, Siyuan Hu et al.","url":"https://arxiv.org/abs/2610.20584","id":"2610.20584","summary":"Computer-use agents have demonstrated strong capabilities in interpreting screens and executing keyboard and mouse actions. However, games, with their visually rich worlds and diverse mechanics, remain challenging and offer a demanding next step toward general digital control. Current game-agent learning pipelines often rely on large-scale demonstrations with limited coverage of dynamic game states, while scalable environments for interactive training remain difficult to obtain. We introduce Player-1, a post-training framework for learning game control beyond demonstrations through synthetic experience. We extend the computer-use action space with relative pointer motion, sustained inputs, and composite actions. For supervised initialization, we fine-tune computer-use models on 6,044 curated gameplay trajectories that pair recorded actions with task instructions and visual reasoning. We construct Player-1-Gym, sixteen synthetic 2D and 3D environments designed around control demands shared across games. Programmatically verifiable rewards and randomized observations and control dynamics support multi-environment reinforcement learning with PPO. The resulting Player-1-9B and Player-1-35B-A3B improve MineDojo-300 success over their SFT policies by 27.8 and 17.7 percentage points, respectively. Player-1-9B reaches 38.33% success compared with 12.63% for the strongest evaluated baseline, with further gains over SFT on ViZDoom-10 and GameWorld. Further analyses show that broader synthetic environment coverage improves transfer, while the use of composite actions that combine multiple keyboard and mouse inputs increases during RL. We demonstrate that learning from synthetic experience substantially improves game control beyond supervised initialization, with gains that generalize beyond the RL training suite."},{"title":"STP-GUI: Spatially-Aware Token Pruning for Efficient Web-GUI Agents","date":"2026-10-14","authors":"Shuo Wang, Sifan Zhou, Xiaobo Wang et al.","url":"https://arxiv.org/abs/2610.20390","id":"2610.20390","summary":"With the rapid development of vision-language models (VLMs), Web-GUI agents have achieved promising performance in interacting with real-world interfaces through screenshot-based grounding. However, high-resolution screenshots and multi-turn histories introduce excessive visual tokens, causing substantial inference overhead. Existing token pruning methods, mainly designed for natural images, often select tokens independently based on importance scores, which can fragment the local visual structures required for recognizing small GUI elements such as buttons, icons, and hyperlinks. In this work, we propose STP-GUI (Spatially-aware Token Pruning for GUI agents), a query-guided token pruning framework that preserves fine-grained instruction-conditioned token scoring while performing spatially coherent window-level selection under aggressive token reduction. A lightweight selector is optimized through policy learning while the VLM backbone remains frozen. Experiments on Online-Mind2Web show that \\papername achieves a favorable efficiency-performance tradeoff under low token budgets. At 21% token retention, it preserves 77.7% of full-token performance while reducing inference latency by 31% and FLOPs by 57%. Results on Android in the Wild further suggest that the method transfers to mobile GUI environments."},{"title":"MAI-Gym: An Open All-in-One Platform for GUI Agent Evaluation and RL Training across Mobile and Computer Environments","date":"2026-10-14","authors":"Panrong Tong, Quyu Kong, Pengxiang Li et al.","url":"https://arxiv.org/abs/2610.20939","id":"2610.20939","summary":"Online reinforcement learning (RL) with verifiable rewards has driven rapid progress in mathematics, coding, and tool use, but scaling this success to GUI agents remains challenging due to the high cost of interactive environments and the scarcity of realistic training tasks. We introduce MAI-Gym, an open all-in-one platform that unifies GUI agent evaluation, data collection, and online RL training across mobile, computer, and web environments. Through a shared rollout pipeline, MAI-Gym ensures consistent agent behavior across evaluation and training, supports ten established benchmarks, and scales to 20,000 parallel environment instances. Beyond scalable infrastructure, MAI-Gym enables automated synthesis of diverse GUI applications and challenging tasks, including resettable mocked apps and coherent cross-app worlds with execution-validated task verifiers. Using MAI-Gym, we train MAI-Gym-9B, a unified 9B agent for mobile and computer use, achieving state-of-the-art performance among open GUI agents under 10B parameters: 78.4% on MobileWorld and 76.2% on OSWorld-Verified. Importantly, RL in a mocked train-ticketing app transfers to its real-world counterpart, improving task success on a phys- ical phone from 28.8% to 48.1%. We release the framework, synthesis skills, mocked apps, 2,000 verified tasks, and the model checkpoint to support repro- ducible research and further advances in scalable GUI agent training."},{"title":"OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents","date":"2026-10-15","authors":"Bowen Yang, Kaiming Jin, Zichen Ding et al.","url":"https://arxiv.org/abs/2610.22234","id":"2610.22234","summary":"Real desktop automation is neither purely visual nor purely programmatic. Agents must understand user-facing interfaces while efficiently manipulating files, scripts, and system state. However, native GUI/code coordination cannot be obtained by prompt-level tool composition. In our preliminary experiments, naively adding a code tool degrades a GUI agent, revealing that GUI/code routing must be internalized through training on high-quality hybrid data. We present OS-Helix, an end-to-end trained multimodal computer-using agent that unifies GUI actions and code execution in one action space. To construct the required supervision, we introduce application-artifact composition, pairing desktop applications with authentic file artifacts to instantiate executable Ubuntu states, and a decoupled instruction/evaluator generation pipeline that produces environment-grounded tasks whose final states can be verified regardless of the solution modality. We cold-start the policy with SFT on filtered hybrid data and further improve it through online RL in live desktop environments. For RL, we propose Step-balanced GSPO, which aggregates importance weight by action step rather than raw assistant tokens to prevent long code actions from dominating heterogeneous-action optimization. On OSWorld-Verified, OS-Helix-27B and OS-Helix-35B-A3B achieve relative improvements of 35.0% and 33.7% over their matched Qwen3.5 hybrid baselines, while OS-Helix-27B-RL further improves by 42.9% to reach 66.44% success. Ablations provide evidence consistent with contributions from learned GUI/code coordination, scalable verifiable supervision, and action step balanced optimization, while demonstrating cross-platform transfer on WindowsAgentArena. Our project homepage is at https://os-copilot.github.io/OS-Helix/."},{"title":"GroundGUI: GUI Grounding by High-Quality Data and Distillation-to-Reinforcement Learning","date":"2026-10-13","authors":"Qingsong Xie, Jiahao Tian, Jiacheng Tang et al.","url":"https://arxiv.org/abs/2610.19100","id":"2610.19100","summary":"Constructing robust GUI agents relies on multimodal visual grounding: the ability to precisely map natural language intents to actionable on-screen components. Despite abundant desktop, web, and mobile benchmarks, high-fidelity resources tailored for diverse environments are surprisingly scarce. To bridge this gap, we introduce the Screen Referring Grounding Dataset (ScreenRef), a comprehensive GUI grounding dataset consisting of GUI screenshots paired with natural language referring expressions and box or point annotations. Spanning desktop, web, and mobile domains, ScreenRef comprises 586K screenshots and over 633K referring expression instances, covering tasks such as text recognition, visual matching, spatial understanding, and refusal scenarios. To boost the model's grounding performance, we propose the Distillation-to-Reinforcement Learning (D2RL) method to address the limited generalization of supervised fine-tuning and the sparse reward problem in reinforcement learning. Utilizing ScreenRef, we train Qwen3-VL-8B-Instruct via sequential SFT and D2RL training, yielding GroundGUI-8B. GroundGUI-8B achieves 95.2% on ScreenSpot-V2, 63.9% on ScreenSpot-Pro, 65.4% on OSWorld-G, 86.8% on MMBench-GUI L2, and 38.3% on UI-Vision. Among 8B-scale models, it produces substantial gains over models trained on open-source datasets, with performance comparable or even superior to models trained on closed-source data. Code, models, and datasets are available at https://github.com/PrentisAI/GroundGUI."},{"title":"Why Generate a Click? Plug-in Decision Heads for Web Agents","date":"2026-10-14","authors":"Chengguang Gan, Yunhao Liang, Hanjun Wei et al.","url":"https://arxiv.org/abs/2610.20107","id":"2610.20107","summary":"Web agents built on vision language models decide every action by generating text such as click(12), although most of that text encodes a choice among a few action types and a few dozen marked elements. We read these choices directly from the hidden states that the generator computes while it reads the goal and the screenshot. Plug-in decision heads on a frozen generator predict the action type, pool the visual tokens inside each numbered box to pick the target, and point at a listed text option or at a WRITE slot that leaves the writing of new text to the generator. A confidence cascade executes the heads' action when they are sure and otherwise lets the generator decode from the KV cache of the same forward pass. With Qwen3-VL 4B and 8B generators trained on 213k web steps, a strict threshold keeps the cascade between 0.3 points below and 1.4 points above the generator on seven offline test sets while the heads decide 12 to 64% of the steps. A looser threshold raises step success on unseen Mind2Web websites by 3.1 and 1.8 points, costs up to 2 points on GUIAct and MiniWoB++, and lifts WebArena task success from 12.5 to 13.8% (4B) and from 13.6 to 14.6% (8B) with less than half of the generated tokens. Training the heads jointly with the generator lowers the generator's own step success by up to 4.9 points; heads on a frozen generator avoid this cost."},{"title":"How GUI Agents Fail: GraceBench for Execution Stability Diagnosis","date":"2026-10-14","authors":"Ridong Zhang, Shuxian Liang, Chaoqun Wan et al.","url":"https://arxiv.org/abs/2610.19900","id":"2610.19900","summary":"As GUI agents are increasingly deployed for mobile task automation, their reliability depends not only on final task outcomes, but also on whether they reach these outcomes through stable interaction trajectories. In automation workflows, unnecessary actions, detours, and execution errors can add noise to collected data, introduce irreversible side effects, or undermine trust, even when the agent eventually completes the task. It is therefore important to systematically diagnose the execution stability, including whether an agent deviates from a feasible path, enters a loop, becomes stagnant, or recovers from unstable actions. Existing benchmarks, however, primarily assess final task success or a small set of intermediate milestones, leaving step-level execution behavior unclear. To bridge this gap, we introduce GraceBench, an online evaluation framework that represents the reachable interaction space of mobile applications as UI Transition Graphs (UTGs), providing a structural reference for step-level execution diagnosis. To support reliable alignment between dynamic UI observations and graph states, GraceBench uses video-grounded trajectory evaluation over this graph-aligned representation, assessing process stability beyond final success with metrics such as deviation rate, loop burden rate, and recovery ability. GraceBench contains 169 tasks spanning 10 applications and constructs 10 UTGs with 2,909 canonical GUI states and 3,116 observed transitions. Across 3,718 trajectories, GraceBench shows that outcome scores hide execution instability: GPT-5.6 Sol achieves the highest success rate (SR) but the lowest recovery ability, 51.24% of successful runs still contain a deviation or loop, and trajectories with the same success rate (SR) and completion rate (CR) can differ substantially in recovery behavior. Code and data will be released on https://iaie-physicalai.github.io/GraceBench."}],"totalRows":12,"truncated":false,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","truncatedPath":"truncated","itemTitlePath":"title","itemSubtitlePath":"url","itemMeta":[],"authorPath":"","timePath":"","sourceNamePath":"","urlPath":"","bodyPath":"","bodyFormat":"","metaFields":[],"commentsPath":"","commentsTitle":"","commentTitlePath":"","commentAuthorPath":"","commentBodyPath":"","commentTimePath":"","commentMeta":[],"language":"","languagePath":"","filenamePath":""}}},"resultType":"object","engine":"offscreen_inner","execution_world":"inner","reason":"inner","trace":[{"time":"2026-10-18T11:05:00.399Z","level":"inner.start","message":"{\"sourceLength\":5565}"}],"elapsedMs":444,"_plugin":{"id":"arxiv-paper-briefing","name":"arXiv 论文速览","displayName":"arXiv 论文速览","category":{"id":"research","label":"研究"},"skillName":"arxiv-paper-briefing","tool":"arxiv_paper_briefing__search_arxiv","capabilityId":"arxiv_paper_briefing__search_arxiv","localName":"search_arxiv","title":"检索 arXiv 论文","familyId":"plugin:research","familyTitle":"研究","profileFamily":"","resultFamily":"generic","labelerId":"static","pageContext":false,"detailLayout":"detail","mediaPresentation":"","script":"scripts/search-arxiv.js","runtime":"inner","mcp":null,"renderer":{"type":"table","title":"arXiv 候选论文","subtitle":"","titlePath":"","subtitlePath":"","titleFormat":"","subtitleFormat":"","sourcePath":"","empty":"","valuePath":"","format":"","fields":[],"columns":[{"label":"标题","path":"title"},{"label":"日期","path":"date"},{"label":"作者","path":"authors"},{"label":"链接","path":"url"}],"itemsPath":"rows","totalPath":"totalRows","tru

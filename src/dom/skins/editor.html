<!doctype html>
<html class="skin-studio-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>qz · Character studio</title>
<link rel="stylesheet" href="../../sidepanel/sidepanel.css"><link rel="stylesheet" href="editor.css">
</head><body class="skin-studio">
  <header class="skin-studio-header">
    <div class="skin-titlebar">
      <div class="skin-studio-brand">
        <picture><source srcset="../../icons/logo-night.png" media="(prefers-color-scheme: dark)"><img src="../../icons/logo-day.png" alt=""></picture>
        <span data-skin-i18n="studio"></span>
      </div>
      <span id="skin-status" role="status" aria-live="polite"></span>
    </div>
    <div class="skin-header-actions">
      <button class="qz-btn qz-btn--ghost" id="skin-revert" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4 2.5 7.5 6 11M3 7.5h8a4.5 4.5 0 0 1 0 9H8"/></svg>
        <span data-skin-i18n="revert"></span>
      </button>
      <button class="qz-btn qz-btn--primary" id="skin-apply" disabled><span data-skin-i18n="apply"></span></button>
    </div>
  </header>
  <div class="skin-studio-layout" id="skin-layout">
    <aside class="skin-library" aria-labelledby="skin-library-title">
      <div class="skin-section-heading"><h2 id="skin-library-title" data-skin-i18n="title"></h2><span id="skin-library-count" aria-hidden="true"></span></div>
      <div id="skin-library-list" class="skin-library-list qz-scroll"></div>
      <button id="skin-duplicate" class="qz-btn qz-btn--ghost qz-btn--sm" data-skin-label="duplicate"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="1.5"/><path d="M12 4H4v9M9 12h5M11.5 9.5v5"/></svg><span data-skin-i18n="duplicate"></span></button>
      <div class="skin-library-imports">
        <div class="skin-library-actions">
          <button id="skin-import-model" class="qz-btn qz-btn--secondary" data-skin-label="importModel">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 6.5 10 3l3.5 3.5M4 11v5h12v-5"/></svg><span data-skin-i18n="importModel"></span>
          </button>
          <button id="skin-import" class="qz-btn qz-btn--ghost" data-skin-label="import">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h5l2-2h7v12H3ZM7 10h6M10 7v6"/></svg><span data-skin-i18n="import"></span>
          </button>
        </div>
        <p class="skin-field-hint" data-skin-i18n="modelHint"></p>
      </div>
      <p class="skin-local-note"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="10" rx="2"/><path d="M7 17h6M10 14v3"/></svg><span data-skin-i18n="local"></span></p>
    </aside>
    <main class="skin-studio-main">
      <section class="skin-preview-stage" aria-labelledby="skin-preview-name">
        <div class="skin-preview-heading">
          <div class="skin-preview-identity"><h1 id="skin-preview-name"></h1><span id="skin-preview-state" class="skin-state-badge" hidden></span></div>
          <div class="skin-stage-actions"><button id="skin-add-character" class="qz-btn qz-btn--ghost qz-btn--sm"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span data-skin-i18n="addCharacter"></span></button><button id="skin-toggle-inspector" class="qz-btn qz-btn--secondary qz-btn--sm" aria-expanded="false" aria-controls="skin-inspector"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><path d="M7 3v4m6 1v4m-5 1v4"/></svg><span data-skin-i18n="adjustments"></span></button></div>
        </div>
        <div class="skin-creative-toolbar">
          <div id="skin-cameras" class="skin-camera-tabs" role="group" data-skin-label="camera">
            <button class="qz-btn qz-btn--ghost qz-btn--sm" data-camera="full" aria-pressed="true" data-skin-i18n="cameraFull"></button>
            <button class="qz-btn qz-btn--ghost qz-btn--sm" data-camera="bust" aria-pressed="false" data-skin-i18n="cameraBust"></button>
            <button class="qz-btn qz-btn--ghost qz-btn--sm" data-camera="close" aria-pressed="false" data-skin-i18n="cameraClose"></button>
          </div>
          <select id="skin-focus-character" class="qz-field qz-select" data-skin-label="character" hidden></select>
          <div class="skin-photo-actions">
            <button id="skin-photo" class="qz-btn qz-btn--ghost qz-btn--sm" data-skin-label="photoHint"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h3l1-2h6l1 2h3v11H3Z"/><circle cx="10" cy="11" r="3"/></svg><span data-skin-i18n="photo"></span></button>
            <button id="skin-portrait" class="qz-btn qz-btn--ghost qz-btn--sm" data-skin-label="portraitHint"><span data-skin-i18n="portrait"></span></button>
            <button id="skin-compare" class="qz-btn qz-btn--ghost qz-btn--sm"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M10 2v16"/></svg><span data-skin-i18n="compare"></span></button>
          </div>
        </div>
        <div class="skin-preview-body">
          <div class="skin-stage-glow" aria-hidden="true"></div>
          <div id="skin-viewer" class="qz-skin-viewer"></div>
          <div class="skin-preview-caption"><p id="skin-preview-quote"></p><button id="skin-shuffle" class="qz-icon-btn qz-icon-btn--sm" data-skin-label="shuffle"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 6.5A6 6 0 0 1 15.5 7M15.5 3.5V7H12M15.8 13.5A6 6 0 0 1 4.5 13M4.5 16.5V13H8"/></svg></button></div>
          <aside id="skin-expressions" class="skin-expressions" hidden aria-labelledby="skin-expressions-title"><h2 id="skin-expressions-title" data-skin-i18n="expressions"></h2><div id="skin-expression-list" class="qz-scroll"></div></aside>
        </div>
        <div class="skin-preview-toolbar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 11V5a1.5 1.5 0 0 1 3 0v5-2a1.5 1.5 0 0 1 3 0v2a1.5 1.5 0 0 1 3 0v2c0 3-2 5-5 5h-1c-2 0-3-1-4-2l-3-4a1.4 1.4 0 0 1 2-2Z"/></svg><span id="skin-drag-hint" data-skin-i18n="drag"></span></div>
      <div class="skin-chat-bar">
        <div class="skin-chat-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 4h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8l-5 3V6a2 2 0 0 1 2-2Z"/><path d="M7 8h6M7 11h4"/></svg></div>
        <div class="skin-chat-copy"><h2 data-skin-i18n="chatTitle"></h2><p data-skin-i18n="hint"></p></div>
        <div class="skin-chat-actions"><button class="qz-btn qz-btn--primary" id="skin-open-chat"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M12 4v12"/></svg><span data-skin-i18n="openChat"></span></button></div>
      </div>
      </section>
      <div id="skin-error" role="alert" hidden></div>
      <button id="skin-reload" class="qz-btn qz-btn--secondary" data-skin-i18n="reload" hidden></button>
    </main>
    <aside id="skin-inspector" class="skin-inspector" aria-labelledby="skin-appearance-title" hidden>
      <div class="skin-inspector-heading"><h2 data-skin-i18n="adjustments"></h2><button id="skin-close-inspector" class="qz-icon-btn qz-icon-btn--sm" data-skin-label="closeAdjustments"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M5 15 15 5"/></svg></button></div>
      <section id="skin-characters" class="skin-inspector-section" hidden>
        <div class="skin-section-heading"><h2 data-skin-i18n="characters"></h2></div>
        <div class="skin-field-group"><label class="qz-field-label" for="skin-character" data-skin-i18n="character"></label><select id="skin-character" class="qz-field qz-select"></select></div>
        <div class="skin-field-group"><label class="qz-field-label" for="skin-character-name" data-skin-i18n="characterName"></label><input id="skin-character-name" class="qz-field" maxlength="100" data-character-field="name"></div>
        <div class="skin-field-group"><span class="qz-field-label" data-skin-i18n="position"></span><div class="skin-position-fields">
          <label>X<input id="skin-character-x" class="qz-field" type="number" step="0.1" min="-100" max="100" data-character-field="x"></label>
          <label>Y<input id="skin-character-y" class="qz-field" type="number" step="0.1" min="-100" max="100" data-character-field="y"></label>
          <label>Z<input id="skin-character-z" class="qz-field" type="number" step="0.1" min="-100" max="100" data-character-field="z"></label>
        </div></div>
        <div class="skin-position-fields skin-character-size">
          <label><span data-skin-i18n="scale"></span><input id="skin-character-scale" class="qz-field" type="number" step="0.05" min="0.01" max="100" data-character-field="scale"></label>
          <label><span data-skin-i18n="facing"></span><input id="skin-character-rotation" class="qz-field" type="number" step="15" min="-360" max="360" data-character-field="rotationY"></label>
        </div>
        <div class="skin-field-group"><label class="qz-field-label" for="skin-character-animation" data-skin-i18n="animation"></label><select id="skin-character-animation" class="qz-field qz-select" data-character-field="animation"></select></div>
        <button id="skin-remove-character" class="qz-btn qz-btn--ghost qz-btn--sm" data-skin-i18n="removeCharacter"></button>
      </section>
      <section class="skin-inspector-section">
        <div class="skin-section-heading"><h2 id="skin-appearance-title" data-skin-i18n="appearance"></h2><span id="skin-visual-label" class="skin-type-badge"></span></div>
        <div class="skin-field-group"><label class="qz-field-label" for="skin-name" data-skin-i18n="name"></label><input id="skin-name" class="qz-field" maxlength="100" autocomplete="off"></div>
        <div class="skin-image-actions"><button id="skin-upload" class="qz-btn qz-btn--ghost qz-btn--sm"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><circle cx="7" cy="7" r="1"/><path d="m4 14 4-4 3 3 2-2 4 4"/></svg><span data-skin-i18n="upload"></span></button><button id="skin-upload-dark" class="qz-btn qz-btn--ghost qz-btn--sm" data-skin-i18n="darkImage"></button></div>
        <div id="skin-model-options" hidden>
          <div class="skin-field-group"><label class="qz-field-label" for="skin-animation" data-skin-i18n="animation"></label><select id="skin-animation" class="qz-field qz-select"></select></div>
          <div class="skin-field-group"><div class="skin-range-heading"><label class="qz-field-label" for="skin-rotation" data-skin-i18n="facing"></label><output id="skin-rotation-value" for="skin-rotation">0°</output></div><input id="skin-rotation" type="range" min="-180" max="180" step="15" value="0"></div>
        </div>
      </section>
      <section class="skin-inspector-section">
        <div class="skin-field-group"><label class="qz-field-label" for="skin-quotes" data-skin-i18n="quotes"></label><textarea id="skin-quotes" class="qz-field" rows="4" dir="auto" aria-describedby="skin-quotes-hint"></textarea><p id="skin-quotes-hint" class="skin-field-hint" data-skin-i18n="quotesHint"></p></div>
      </section>
      <details id="skin-source-details" class="skin-inspector-section">
        <summary><span data-skin-i18n="advanced"></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg></summary>
        <div class="skin-source-content"><button id="skin-copy-prompt" class="qz-icon-btn qz-icon-btn--md" data-skin-label="copyPrompt"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="1.5"/><path d="M12 4H4v9"/></svg></button><label class="qz-field-label" for="skin-source" data-skin-i18n="source"></label><textarea id="skin-source" class="qz-field" rows="12" spellcheck="false" aria-label="Scene source"></textarea><button id="skin-update-source" class="qz-btn qz-btn--secondary qz-btn--sm" data-skin-i18n="updateSource"></button></div>
      </details>
      <div class="skin-inspector-actions">
        <button id="skin-export" class="qz-btn qz-btn--secondary qz-btn--sm"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v4h12v-4"/></svg><span data-skin-i18n="export"></span></button>
        <button id="skin-delete" class="qz-icon-btn qz-icon-btn--danger qz-icon-btn--sm" data-skin-label="delete"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M7 5V3h6v2M5 5l1 12h8l1-12M8 8v6m4-6v6"/></svg></button>
      </div>
    </aside>
  </div>
  <dialog id="skin-comparison" class="skin-comparison" aria-labelledby="skin-comparison-title">
    <header><div><h2 id="skin-comparison-title" data-skin-i18n="compare"></h2><p data-skin-i18n="compareHint"></p></div><button id="skin-close-comparison" class="qz-btn qz-btn--secondary qz-btn--sm" data-skin-i18n="closeCompare"></button></header>
    <p id="skin-comparison-loading" role="status" data-skin-i18n="compareLoading"></p>
    <div id="skin-comparison-images" class="skin-comparison-images" hidden><figure><img id="skin-compare-before" alt=""><figcaption data-skin-i18n="compareBefore"></figcaption></figure><figure><img id="skin-compare-after" alt=""><figcaption data-skin-i18n="compareAfter"></figcaption></figure></div>
  </dialog>
  <template id="skin-type-model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9ZM4 7.5l8 4.5 8-4.5M12 12v9M8 5.25l8 4.5"/></svg></template>
  <template id="skin-type-image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg></template>
  <input id="skin-import-file" type="file" accept=".json,.qzskin" hidden>
  <input id="skin-image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <div id="skin-drop-target" hidden><div><strong data-skin-i18n="dropModels"></strong><p data-skin-i18n="sceneHint"></p></div></div>
  <input id="skin-model-file" type="file" accept=".glb,.vrm,model/gltf-binary" multiple hidden>
  <script type="module" src="editor.js"></script>
</body></html>
